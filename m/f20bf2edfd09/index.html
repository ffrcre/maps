<style>
  :root { --navy:#1b2a4a; --accent:#8a1f2d; --ink:#1d2430; --muted:#5c6675; --line:#dfe3ea; --bg:#f6f7f9; --panel:#ffffff;
          --new:#2f6fd8; --go:#1f9d4a; --hold:#e0a100; --pass:#8a8f98; --loi:#7b3fd6; --lease:#e0631a; --executed:#0b6b3a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  #top { position:fixed; top:0; left:0; right:0; z-index:1200; background:var(--navy); color:#fff; padding:8px 12px calc(8px); display:flex; align-items:center; gap:10px; padding-top:calc(8px + env(safe-area-inset-top)); }
  #top h1 { font-size:15px; margin:0; font-weight:600; line-height:1.2; flex:1; min-width:0; }
  #top .sub { font-size:11px; opacity:.8; font-weight:400; display:block; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #top button { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:8px; padding:7px 10px; font-size:13px; cursor:pointer; }
  #top button.on { background:#fff; color:var(--navy); }
  #map { position:fixed; top:0; bottom:0; left:0; right:0; }
  body.desk #map { left:340px; }
  #side { position:fixed; top:0; bottom:0; left:0; width:340px; background:var(--panel); border-right:1px solid var(--line); z-index:1100; overflow:auto; padding-top:72px; display:none; }
  body.desk #side { display:block; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:70vh; overflow:auto; background:var(--panel); border-top:1px solid var(--line); border-radius:14px 14px 0 0; box-shadow:0 -6px 24px rgba(0,0,0,.18); z-index:1150; display:none; padding-bottom:env(safe-area-inset-bottom); }
  #sheet.open { display:block; }
  body.desk #sheet { left:340px; }
  .grab { width:40px; height:4px; background:#c9ced8; border-radius:2px; margin:8px auto 4px; }
  .pane { padding:10px 14px 16px; }
  .pane h2 { font-size:14px; margin:8px 0 6px; color:var(--navy); }
  .pane h3 { font-size:12px; margin:12px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .row { display:flex; align-items:center; gap:8px; padding:5px 0; font-size:14px; }
  .row input { width:18px; height:18px; }
  .row .n { margin-left:auto; color:var(--muted); font-size:12px; }
  .sw { width:14px; height:14px; border-radius:50%; display:inline-block; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.25); }
  .sw.sq { border-radius:3px; }
  .sw.dia { transform:rotate(45deg); border-radius:2px; }
  .chip { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; color:#fff; font-weight:600; }
  .sites-list .item { padding:8px 0; border-bottom:1px solid var(--line); cursor:pointer; }
  .sites-list .item b { font-size:14px; display:block; }
  .sites-list .item span { font-size:12px; color:var(--muted); }
  .note { font-size:12px; color:var(--muted); line-height:1.4; }
  .foot { font-size:11px; color:var(--muted); line-height:1.5; padding:8px 0 0; }
  .leaflet-popup-content { margin:10px 12px; font-size:13px; line-height:1.4; min-width:220px; max-width:300px; }
  .leaflet-popup-content h4 { margin:0 0 4px; font-size:15px; color:var(--navy); }
  .leaflet-popup-content .kv { margin:2px 0; }
  .leaflet-popup-content .kv b { color:var(--muted); font-weight:500; }
  .leaflet-popup-content a { color:var(--accent); }
  .pin { width:26px; height:26px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .pin span { transform:rotate(45deg); color:#fff; font-size:11px; font-weight:700; }
  .store { width:22px; height:22px; background:var(--navy); border:2px solid #fff; border-radius:4px; box-shadow:0 2px 6px rgba(0,0,0,.35); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .dev { width:22px; height:22px; background:#c04b8f; border:2px solid #fff; transform:rotate(45deg); box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .dev.comp { background:#b91c1c; }
  .day { width:22px; height:22px; border-radius:50%; background:#0e7490; border:2px solid #fff; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35); }
  .terr-label { background:rgba(255,255,255,.85); border:1px solid rgba(0,0,0,.2); border-radius:6px; padding:2px 6px; font-size:11px; font-weight:600; color:#1d2430; white-space:nowrap; }
  #lock { position:fixed; inset:0; z-index:2000; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; padding:20px; }
  #lock .card { background:#fff; color:var(--ink); border-radius:14px; padding:22px; width:100%; max-width:380px; box-shadow:0 12px 40px rgba(0,0,0,.35); }
  #lock h1 { font-size:18px; margin:0 0 4px; color:var(--navy); }
  #lock p { font-size:13px; color:var(--muted); margin:0 0 14px; }
  #lock input[type=password] { width:100%; font-size:17px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; }
  #lock label { font-size:13px; display:flex; align-items:center; gap:8px; margin:12px 0; color:var(--muted); }
  #lock button { width:100%; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
  #lock .err { color:var(--accent); font-size:13px; min-height:18px; margin-top:8px; }
  #printview { display:none; }
  @media print {
    #top, #sheet, #side, #lock, .leaflet-control-container { display:none !important; }
    #map { position:relative !important; height:60vh !important; left:0 !important; page-break-after:always; }

    #printview table { border-collapse:collapse; width:100%; }
    #printview th, #printview td { border:1px solid #bbb; padding:4px 6px; vertical-align:top; text-align:left; }
    #printview h1 { font-size:16px; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  'use strict';
  const SLUG = location.pathname.replace(/[^a-z0-9]/gi,'').slice(-24) || 'clientmap';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  async function unlock(pw){
    const v = JSON.parse(document.getElementById('sealed').textContent);
    const enc = new TextEncoder();
    const km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(v.salt), iterations:v.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(v.nonce)}, key, b64(v.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  const lock = document.getElementById('lock'), pwEl = document.getElementById('pw'), err = document.getElementById('err');
  async function tryOpen(pw, remember){
    err.textContent = 'Opening…';
    try {
      const data = await unlock(pw);
      if (remember) localStorage.setItem('cm-pw-'+SLUG, pw); else localStorage.removeItem('cm-pw-'+SLUG);
      lock.style.display = 'none';
      init(data);
    } catch (e) {
      err.textContent = 'That passphrase didn’t work.';
      localStorage.removeItem('cm-pw-'+SLUG);
    }
  }
  document.getElementById('go').addEventListener('click', () => tryOpen(pwEl.value.trim(), document.getElementById('remember').checked));
  document.getElementById('lockform').addEventListener('submit', e => { e.preventDefault(); tryOpen(pwEl.value.trim(), document.getElementById('remember').checked); });
  const saved = localStorage.getItem('cm-pw-'+SLUG);
  if (saved) tryOpen(saved, true);

  // ------------------------------------------------------------- the map
  const STATUS = { new:'#2f6fd8', go:'#1f9d4a', hold:'#e0a100', pass:'#8a8f98', loi:'#7b3fd6', lease:'#e0631a', executed:'#0b6b3a' };
  const STATUS_ORDER = ['executed','lease','loi','go','hold','new','pass'];
  const BRAND_COLOUR = { grocery:'#16a34a', bigbox:'#2563eb', traffic:'#9333ea', competitor:'#dc2626' };
  const DAY = { hospital:['H','#0e7490','Hospitals and medical campuses'], university:['U','#0f766e','Universities and colleges'], high_school:['S','#0369a1','High schools'], military:['M','#4b5563','Military installations'], office_park:['O','#7c2d12','Office parks and corporate campuses'] };
  const LAYER_LABEL = { grocery:'Grocery anchors', bigbox:'Big box and club', traffic:'Traffic drivers (Scheels, Dick’s, REI, TJ Maxx, HomeGoods, Sierra, Ross, Marshalls, Kohl’s)', competitor:'Sandwich competitors' };
  const DEFAULT_ON = new Set(['sites','territories','stores','pipeline','grocery','competitor','hospital']);

  function init(data){
    document.body.classList.toggle('desk', window.innerWidth >= 900);
    const meta = data.meta || {};
    document.getElementById('title').textContent = meta.title || document.title;
    document.getElementById('stamp').textContent = 'Sites as of ' + fmt(meta.sites_as_of) + ' · page updated ' + fmt(meta.generated_at);

    const map = L.map('map', { zoomControl: true, preferCanvas: true, worldCopyJump: false }).setView([39.55, -104.9], 9);
    const aerial = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery: Esri, Maxar, Earthstar Geographics' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, opacity: .9 }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
    ]);
    const street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Map: Esri, HERE, Garmin, OpenStreetMap contributors' });
    let onAerial = true; aerial.addTo(map);
    const btnBase = document.getElementById('btn-base');
    btnBase.addEventListener('click', () => { onAerial = !onAerial; if (onAerial) { map.removeLayer(street); aerial.addTo(map); btnBase.textContent = 'Street'; } else { map.removeLayer(aerial); street.addTo(map); btnBase.textContent = 'Aerial'; } });

    const groups = {};
    // territories
    const terr = L.layerGroup();
    (data.territories || []).forEach(t => {
      const col = t.colour || '#3f60a0';
      const gj = L.geoJSON({type:'Feature', geometry:t.geometry}, { style: { color: col, weight: 2, opacity: .9, fillColor: col, fillOpacity: .13 } });
      gj.bindTooltip(esc(t.short) + ' · ' + esc(t.developer), { permanent: true, direction: 'center', className: 'terr-label' });
      gj.bindPopup('<h4>' + esc(t.name) + '</h4><div class="kv"><b>Who can take sites here:</b> ' + esc(t.developer) + '</div><div class="note">' + esc(meta.territory_note || 'Boundary approximate.') + '</div>');
      terr.addLayer(gj);
    });
    groups.territories = terr;

    // sites
    const sites = L.layerGroup(); const siteMarkers = {};
    const sorted = (data.sites || []).slice().sort((a,b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status) || a.name.localeCompare(b.name));
    sorted.forEach((s, i) => {
      const col = STATUS[s.status] || STATUS.new;
      const icon = L.divIcon({ className: '', html: '<div class="pin" style="background:' + col + '"><span>' + (i+1) + '</span></div>', iconSize: [26,26], iconAnchor: [13,26], popupAnchor: [0,-24] });
      const m = L.marker([s.lat, s.lon], { icon, title: s.name }).bindPopup(sitePopup(s, i+1, meta), { maxWidth: 320 });
      siteMarkers[s.id] = m; sites.addLayer(m);
    });
    groups.sites = sites;

    // existing stores
    const stores = L.layerGroup();
    (data.stores || []).forEach(st => {
      const icon = L.divIcon({ className:'', html:'<div class="store">' + esc(st.store_no || '★') + '</div>', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12] });
      stores.addLayer(L.marker([st.lat, st.lon], { icon, title: st.name }).bindPopup('<h4>' + esc(meta.client || 'Store') + (st.store_no ? ' #' + esc(st.store_no) : '') + '</h4><div class="kv">' + esc(st.address) + ', ' + esc(st.city) + '</div><div class="kv"><b>Existing store</b>' + (st.status && st.status !== 'open' ? ' · ' + esc(st.status.replace('_',' ')) : '') + '</div>'));
    });
    groups.stores = stores;

    // development pipeline
    const pipe = L.layerGroup();
    (data.pipeline || []).forEach(p => {
      const cls = p.kind === 'competitor-opening' ? 'dev comp' : 'dev';
      const icon = L.divIcon({ className:'', html:'<div class="' + cls + '"></div>', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12] });
      pipe.addLayer(L.marker([p.lat, p.lon], { icon, title: p.title }).bindPopup('<h4>' + esc(p.title) + '</h4><div class="kv"><b>' + esc(kindLabel(p.kind)) + '</b>' + (p.status ? ' · ' + esc(p.status) : '') + '</div>' + (p.address ? '<div class="kv">' + esc(p.address) + '</div>' : '') + '<div class="kv"><b>Territory:</b> ' + esc(p.region || '') + (p.region_who ? ' — ' + esc(p.region_who) : '') + '</div><div class="kv">' + esc(p.summary || '') + '</div>' + (p.source ? '<div class="note">Source: ' + esc(p.source) + (p.reported ? ' (' + esc(p.reported) + ')' : '') + '. Reported, not yet confirmed with the developer.</div>' : '')));
    });
    groups.pipeline = pipe;

    // anchors, competitors, daytime drivers: light circle markers, only drawn at zoom >= 10
    const layers = data.layers || {};
    const dotGroups = {};
    Object.keys(layers).forEach(cat => {
      const g = L.layerGroup(); const items = layers[cat] || [];
      items.forEach(it => {
        let mk;
        if (DAY[cat]) {
          const [letter, col] = DAY[cat];
          mk = L.marker([it.lat, it.lon], { icon: L.divIcon({ className:'', html:'<div class="day" style="background:' + col + '">' + letter + '</div>', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12] }), title: it.name });
        } else {
          const col = BRAND_COLOUR[cat] || '#333';
          mk = L.circleMarker([it.lat, it.lon], { radius: cat === 'competitor' ? 5 : 6, color: '#fff', weight: 1.5, fillColor: col, fillOpacity: .95 });
        }
        mk.bindPopup('<h4>' + esc(it.name || it.brand) + '</h4><div class="kv"><b>' + esc(it.sub || it.brand || DAY[cat] ? (it.sub || it.brand || DAY[cat][2]) : cat) + '</b>' + (it.status && it.status !== 'open' ? ' · ' + esc(it.status) : '') + '</div><div class="note">Location from OpenStreetMap.</div>');
        g.addLayer(mk);
      });
      dotGroups[cat] = g; groups[cat] = g;
    });

    const on = new Set(DEFAULT_ON);
    function apply(){
      Object.keys(groups).forEach(k => {
        const want = on.has(k) && (!dotGroups[k] || map.getZoom() >= 10);
        if (want && !map.hasLayer(groups[k])) groups[k].addTo(map);
        if (!want && map.hasLayer(groups[k])) map.removeLayer(groups[k]);
      });
      if (map.hasLayer(groups.sites)) groups.sites.eachLayer(l => l.bringToFront && l.bringToFront());
    }
    map.on('zoomend', apply);
    apply();

    // fit to the sites, or the territories
    const pts = sorted.map(s => [s.lat, s.lon]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.15)); else if (data.territories && data.territories.length) map.fitBounds(terr.getBounds());

    // panels
    const counts = meta.counts || {};
    function layersPane(){
      let h = '<h2>Layers</h2>';
      const rows = [['sites','Sites for ' + esc(meta.client || 'the client'), 'pin'], ['territories','Territories (approximate)','terr'], ['stores','Existing ' + esc(meta.client || '') + ' stores','store'], ['pipeline','New development and anchor pipeline','dev']];
      rows.forEach(([k, label, kind]) => { h += row(k, label, swatch(kind), counts[k]); });
      h += '<h3>Anchors</h3>';
      ['grocery','bigbox','traffic'].forEach(k => { h += row(k, LAYER_LABEL[k], '<span class="sw" style="background:' + BRAND_COLOUR[k] + '"></span>', counts[k]); });
      h += '<h3>Daytime drivers</h3>';
      Object.keys(DAY).forEach(k => { h += row(k, DAY[k][2], '<span class="sw" style="background:' + DAY[k][1] + '"></span>', counts[k]); });
      h += '<h3>Competitors</h3>' + row('competitor', LAYER_LABEL.competitor, '<span class="sw" style="background:' + BRAND_COLOUR.competitor + '"></span>', counts.competitor);
      h += '<h3>Pin colours</h3>';
      Object.keys(STATUS).forEach(k => { h += '<div class="row"><span class="sw" style="background:' + STATUS[k] + '"></span>' + esc((meta.status_legend || {})[k] || k) + '</div>'; });
      h += '<div class="note" style="margin-top:8px">Anchors, competitors and daytime drivers appear once you zoom in. ' + esc(meta.territory_note || '') + '</div>';
      h += '<div class="foot">Anchor and competitor locations from OpenStreetMap contributors, pulled ' + fmt((meta.layers_as_of||{}).anchors) + '. Existing stores from the ' + esc(meta.client || '') + ' locator, ' + fmt((meta.layers_as_of||{}).stores) + '. Pipeline items are reported from public sources and not yet confirmed with the developer.</div>';
      h += '<div class="foot">' + esc(meta.contact_line || '') + '</div>';
      return h;
    }
    function row(k, label, sw, n){ return '<label class="row"><input type="checkbox" data-layer="' + k + '"' + (on.has(k) ? ' checked' : '') + '>' + sw + '<span>' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</label>'; }
    function swatch(kind){ return kind === 'pin' ? '<span class="sw" style="background:' + STATUS.new + '"></span>' : kind === 'store' ? '<span class="sw sq" style="background:#1b2a4a"></span>' : kind === 'dev' ? '<span class="sw dia" style="background:#c04b8f"></span>' : '<span class="sw" style="background:#3f60a0;opacity:.5"></span>'; }
    function listPane(){
      let h = '<h2>Sites (' + sorted.length + ')</h2><div class="sites-list">';
      sorted.forEach((s, i) => {
        h += '<div class="item" data-site="' + esc(s.id) + '"><b>' + (i+1) + '. ' + esc(s.name) + ' <span class="chip" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(s.status_label) + '</span></b><span>' + esc(s.address) + ', ' + esc(s.city) + ' · ' + esc(s.region) + (s.region_who ? ' (' + esc(s.region_who) + ')' : '') + '</span></div>';
      });
      h += '</div><div class="foot" style="margin-top:10px"><button onclick="window.print()" style="padding:8px 12px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer">Print / save as PDF</button></div>';
      return h;
    }
    function wire(container){
      container.querySelectorAll('input[data-layer]').forEach(cb => cb.addEventListener('change', e => { const k = e.target.getAttribute('data-layer'); if (e.target.checked) on.add(k); else on.delete(k); apply(); }));
      container.querySelectorAll('.item[data-site]').forEach(el => el.addEventListener('click', () => { const m = siteMarkers[el.getAttribute('data-site')]; if (!m) return; if (!on.has('sites')) { on.add('sites'); apply(); } map.setView(m.getLatLng(), Math.max(map.getZoom(), 14)); m.openPopup(); if (!document.body.classList.contains('desk')) sheet.classList.remove('open'); }));
    }
    const sheet = document.getElementById('sheet'), sheetpane = document.getElementById('sheetpane'), sidepane = document.getElementById('sidepane');
    let mode = 'layers';
    function render(){
      if (document.body.classList.contains('desk')) { sidepane.innerHTML = layersPane() + '<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">' + listPane(); wire(sidepane); }
      else { sheetpane.innerHTML = mode === 'layers' ? layersPane() : listPane(); wire(sheetpane); }
    }
    document.getElementById('btn-layers').addEventListener('click', () => { if (document.body.classList.contains('desk')) { document.getElementById('side').scrollTop = 0; return; } if (mode === 'layers' && sheet.classList.contains('open')) sheet.classList.remove('open'); else { mode = 'layers'; render(); sheet.classList.add('open'); } });
    document.getElementById('btn-list').addEventListener('click', () => { if (document.body.classList.contains('desk')) { const el = sidepane.querySelector('.sites-list'); if (el) el.scrollIntoView(); return; } if (mode === 'list' && sheet.classList.contains('open')) sheet.classList.remove('open'); else { mode = 'list'; render(); sheet.classList.add('open'); } });
    map.on('click', () => sheet.classList.remove('open'));
    window.addEventListener('resize', () => { const d = window.innerWidth >= 900; if (d !== document.body.classList.contains('desk')) { document.body.classList.toggle('desk', d); render(); setTimeout(() => map.invalidateSize(), 50); } });
    render();

    // print view
    let pv = '<h1>' + esc(meta.title || '') + '</h1><div>Sites as of ' + fmt(meta.sites_as_of) + '. ' + esc(meta.territory_note || '') + '</div><table><tr><th>#</th><th>Site</th><th>Status</th><th>Territory</th><th>Size</th><th>Asking</th><th>NNN</th><th>Traffic</th><th>Notes</th></tr>';
    sorted.forEach((s, i) => { pv += '<tr><td>' + (i+1) + '</td><td>' + esc(s.name) + '<br>' + esc(s.address) + ', ' + esc(s.city) + '</td><td>' + esc(s.status_label) + '</td><td>' + esc(s.region) + (s.region_who ? '<br>' + esc(s.region_who) : '') + '</td><td>' + esc(sizeText(s)) + '</td><td>' + esc(rentText(s)) + '</td><td>' + esc(nnnText(s)) + '</td><td>' + esc(s.traffic || '') + '</td><td>' + esc(s.notes || '') + (s.brochure_url ? '<br>' + esc(s.brochure_url) : '') + '</td></tr>'; });
    pv += '</table><div style="margin-top:8px">' + esc(meta.contact_line || '') + '</div>';
    document.getElementById('printview').innerHTML = pv;
  }

  function sitePopup(s, n, meta){
    let h = '<h4>' + n + '. ' + esc(s.name) + '</h4>';
    h += '<div class="kv"><span class="chip" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(s.status_label) + '</span></div>';
    h += '<div class="kv">' + esc(s.address) + (s.corner ? ' (' + esc(s.corner) + ')' : '') + ', ' + esc(s.city) + (s.zip ? ' ' + esc(s.zip) : '') + '</div>';
    h += '<div class="kv"><b>Territory:</b> ' + esc(s.region) + (s.region_who ? ' — ' + esc(s.region_who) + ' can take it' : '') + '</div>';
    const size = sizeText(s), rent = rentText(s), nnn = nnnText(s);
    if (size) h += '<div class="kv"><b>Size:</b> ' + esc(size) + '</div>';
    if (rent) h += '<div class="kv"><b>Asking:</b> ' + esc(rent) + (nnn ? ' + ' + esc(nnn) + ' NNN' : '') + '</div>';
    else if (nnn) h += '<div class="kv"><b>NNN:</b> ' + esc(nnn) + '</div>';
    if (s.traffic) h += '<div class="kv"><b>Traffic:</b> ' + esc(s.traffic) + '</div>';
    if (s.notes) h += '<div class="kv">' + esc(s.notes) + '</div>';
    if (s.brochure_url) h += '<div class="kv"><a href="' + esc(s.brochure_url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.brochure_label || 'Brochure') + ' ↗</a></div>';
    h += '<div class="kv"><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.lat + ',' + s.lon) + '" target="_blank" rel="noopener noreferrer">Open in Google Maps ↗</a></div>';
    return h;
  }
  function sizeText(s){ return s.size_sf ? Math.round(s.size_sf).toLocaleString() + ' SF' : (s.size_text || ''); }
  function rentText(s){ return s.rent_psf ? '$' + s.rent_psf.toFixed(2) + '/SF' : (s.rent_text || ''); }
  function nnnText(s){ return s.nnn_psf ? '$' + s.nnn_psf.toFixed(2) + '/SF' : (s.nnn_text || ''); }
  function kindLabel(k){ return ({'development':'New development','anchor-opening':'Anchor opening','anchor-announced':'Anchor announced','competitor-opening':'Competitor opening','land-purchase':'Land purchase'})[k] || (k || ''); }
  function fmt(iso){ if (!iso) return 'n/a'; const d = new Date(iso); if (isNaN(d)) return iso; return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
})();
</script>
</body>
</html>
