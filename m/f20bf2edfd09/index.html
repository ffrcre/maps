<style>

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }
  button { font:inherit; cursor:pointer; }
  #top { position:fixed; top:0; left:0; right:0; height:calc(var(--topbar) + env(safe-area-inset-top)); padding-top:env(safe-area-inset-top); z-index:1200; background:var(--navy); color:#fff; display:flex; align-items:center; gap:8px; padding-left:14px; padding-right:10px; }

  #top h1 { font-size:15px; margin:0; font-weight:650; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .seg { display:inline-flex; background:rgba(255,255,255,.14); border-radius:9px; padding:2px; }
  .seg button { background:transparent; color:#fff; border:0; border-radius:7px; padding:6px 10px; font-size:13px; }

  .iconbtn { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:7px 11px; font-size:13px; }
  body.desk .mobile-only { display:none !important; }
  #chips { position:fixed; top:calc(var(--topbar) + env(safe-area-inset-top)); left:0; right:0; z-index:1150; display:flex; gap:6px; padding:8px 10px; overflow-x:auto; scrollbar-width:none; background:linear-gradient(rgba(244,245,247,.97), rgba(244,245,247,.86)); backdrop-filter:blur(6px); }

  body.desk #chips { left:var(--panelw); }
  .chip { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .chip .dot { width:9px; height:9px; border-radius:50%; background:#c5cad3; }
  .chip.on { color:var(--ink); border-color:#c9cfda; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .chip.on .dot { background:var(--c); }

<script>
(function(){
  'use strict';
  const SLUG = location.pathname.replace(/[^a-z0-9]/gi,'').slice(-24) || 'clientmap';
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let LOGOS = {}; try { LOGOS = JSON.parse(document.getElementById('logos').textContent || '{}'); } catch (e) {}

  async function unlock(pw){
    const v = JSON.parse(document.getElementById('sealed').textContent);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(v.salt), iterations:v.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(v.nonce)}, key, b64(v.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const lock = document.getElementById('lock'), pwEl = document.getElementById('pw'), err = document.getElementById('err');
  async function tryOpen(pw, remember){
    err.textContent = 'Opening…';
    try { const data = await unlock(pw); if (remember) localStorage.setItem('cm-pw-'+SLUG, pw); else localStorage.removeItem('cm-pw-'+SLUG); lock.style.display = 'none'; init(data); }
    catch (e) { err.textContent = 'That passphrase didn’t work.'; localStorage.removeItem('cm-pw-'+SLUG); }
  }
  document.getElementById('lockform').addEventListener('submit', e => { e.preventDefault(); tryOpen(pwEl.value.trim(), document.getElementById('remember').checked); });
  const saved = localStorage.getItem('cm-pw-'+SLUG); if (saved) tryOpen(saved, true);

  const STATUS = { new:'#2f6fd8', go:'#1f9d4a', hold:'#e0a100', pass:'#8a8f98', loi:'#7b3fd6', lease:'#e0631a', executed:'#0b6b3a' };
  const ORDER = ['executed','lease','loi','go','hold','new','pass'];
  const SHORT = { new:'New', go:'Go', hold:'On hold', pass:'Passed', loi:'LOI', lease:'Lease', executed:'Executed' };
  const CATC = { grocery:'#16a34a', bigbox:'#2563eb', traffic:'#9333ea', competitor:'#dc2626' };
  const CATL = { grocery:'Grocery', bigbox:'Big box and club', traffic:'Traffic drivers', competitor:'Sandwich competitors' };
  const DAY = { hospital:['H','#0e7490','Hospitals and medical campuses'], university:['U','#0f766e','Universities and colleges'], high_school:['S','#0369a1','High schools'], military:['M','#4b5563','Military installations'], office_park:['O','#7c2d12','Office parks and campuses'] };
  const DEFAULT_ON = new Set(['sites','territories','stores','pipeline','grocery','competitor','hospital']);
  const fmt = iso => { if (!iso) return 'n/a'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); };
  const sizeText = s => s.size_sf ? Math.round(s.size_sf).toLocaleString() + ' SF' : (s.size_text || '');
  const rentText = s => s.rent_psf ? '$' + s.rent_psf.toFixed(2) + '/SF' : (s.rent_text || '');
  const nnnText = s => s.nnn_psf ? '$' + s.nnn_psf.toFixed(2) + '/SF' : (s.nnn_text || '');
  const kindLabel = k => ({'development':'New development','anchor-opening':'Anchor opening','anchor-announced':'Anchor announced','competitor-opening':'Competitor opening','land-purchase':'Land purchase'})[k] || (k || '');
  function logoIcon(brand, colour, size){
    const src = LOGOS[brand];
    const html = src ? '<div class="badge" style="border-color:' + colour + '"><img src="' + src + '" alt=""></div>'
                     : '<div class="badge txt" style="background:' + colour + ';border-color:#fff">' + esc((brand || '?').slice(0,2)) + '</div>';
    return L.divIcon({ className:'', html, iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2] });
  }

  function init(data){
    const meta = data.meta || {};
    document.body.classList.toggle('desk', window.innerWidth >= 900);
    document.getElementById('title').textContent = meta.title || document.title;
    document.getElementById('stamp').textContent = 'Sites as of ' + fmt(meta.sites_as_of) + ' · updated ' + fmt(meta.generated_at);

    const map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([39.55,-104.9], 9);
    L.control.zoom({ position:'bottomright' }).addTo(map);
    const aerial = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imagery: Esri, Maxar, Earthstar Geographics' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, opacity:.9 }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 })]);
    const street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Map: Esri, HERE, Garmin, OpenStreetMap contributors' });
    aerial.addTo(map);
    const bA = document.getElementById('b-aerial'), bS = document.getElementById('b-street');
    bA.onclick = () => { map.removeLayer(street); aerial.addTo(map); bA.classList.add('on'); bS.classList.remove('on'); };
    bS.onclick = () => { map.removeLayer(aerial); street.addTo(map); bS.classList.add('on'); bA.classList.remove('on'); };

    const groups = {};
    const terr = L.layerGroup();
    (data.territories || []).forEach(t => {
      const col = t.colour || '#3f60a0';
      const gj = L.geoJSON({type:'Feature', geometry:t.geometry}, { style:{ color:col, weight:2, opacity:.9, fillColor:col, fillOpacity:.12 } });
      gj.bindTooltip(esc(t.short) + ' · ' + esc(t.developer), { permanent:true, direction:'center', className:'terr-label' });
      gj.bindPopup('<div class="pop"><h4>' + esc(t.name) + '</h4><div class="addr">Who can take sites here: <b>' + esc(t.developer) + '</b></div><div class="src">' + esc(meta.territory_note || 'Boundary approximate.') + '</div></div>');
      terr.addLayer(gj);
    });
    groups.territories = terr;

    const sorted = (data.sites || []).slice().sort((a,b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.name.localeCompare(b.name));
    sorted.forEach((s, i) => s._n = i + 1);
    const siteMarkers = {};
    const sites = L.layerGroup();
    sorted.forEach(s => {
      const col = STATUS[s.status] || STATUS.new;
      const icon = L.divIcon({ className:'', html:'<div class="pin" style="background:' + col + '"><span>' + s._n + '</span></div>', iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-26] });
      siteMarkers[s.id] = L.marker([s.lat, s.lon], { icon, title:s.name }).bindPopup(sitePopup(s), { maxWidth:340 });
    });
    groups.sites = sites;
    const statusOn = new Set(Object.keys(STATUS));
    function applySites(){ sites.clearLayers(); sorted.forEach(s => { if (statusOn.has(s.status)) sites.addLayer(siteMarkers[s.id]); }); }
    applySites();

    const stores = L.layerGroup();
    const clientLogo = LOGOS[meta.client];
    (data.stores || []).forEach(st => {
      const html = clientLogo ? '<div class="store"><img src="' + clientLogo + '" alt=""></div>' : '<div class="store txt">' + esc(st.store_no || '★') + '</div>';
      stores.addLayer(L.marker([st.lat, st.lon], { icon:L.divIcon({ className:'', html, iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-16] }), title:st.name })
        .bindPopup('<div class="pop"><h4>' + esc(meta.client || 'Store') + (st.store_no ? ' #' + esc(st.store_no) : '') + '</h4><div class="addr">' + esc(st.address) + ', ' + esc(st.city) + '</div><div class="chipline"><span class="tag grey">Existing store' + (st.status && st.status !== 'open' ? ' · ' + esc(st.status.replace('_',' ')) : '') + '</span></div></div>'));
    });
    groups.stores = stores;

    const pipe = L.layerGroup();
    (data.pipeline || []).forEach(p => {
      const html = '<div class="dev' + (p.kind === 'competitor-opening' ? ' comp' : '') + '"></div>';
      pipe.addLayer(L.marker([p.lat, p.lon], { icon:L.divIcon({ className:'', html, iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-10] }), title:p.title })
        .bindPopup('<div class="pop"><h4>' + esc(p.title) + '</h4><div class="chipline"><span class="tag" style="background:#c04b8f">' + esc(kindLabel(p.kind)) + '</span>' + (p.status ? '<span class="tag grey">' + esc(p.status) + '</span>' : '') + '</div>' + (p.address ? '<div class="addr">' + esc(p.address) + '</div>' : '') + '<div class="notes">' + esc(p.summary || '') + '</div><div class="addr">Territory: ' + esc(p.region || '') + (p.region_who ? ' · ' + esc(p.region_who) : '') + '</div>' + (p.source ? '<div class="src">Source: ' + esc(p.source) + (p.reported ? ' (' + esc(p.reported) + ')' : '') + '. Reported, not yet confirmed with the developer.</div>' : '') + '</div>'));
    });
    groups.pipeline = pipe;

    const layers = data.layers || {};
    const dotGroups = {}, badgeGroups = {};
    Object.keys(layers).forEach(cat => {
      const items = layers[cat] || [];
      const dots = L.layerGroup(), badges = L.layerGroup();
      items.forEach(it => {
        const col = DAY[cat] ? DAY[cat][1] : (CATC[cat] || '#333');
        const pop = '<div class="pop"><h4>' + esc(it.name || it.brand) + '</h4><div class="chipline"><span class="tag" style="background:' + col + '">' + esc(DAY[cat] ? DAY[cat][2] : (it.sub || it.brand || cat)) + '</span>' + (it.status && it.status !== 'open' ? '<span class="tag grey">' + esc(it.status) + '</span>' : '') + '</div><div class="src">Location from OpenStreetMap' + (cat === 'competitor' ? ' and the brand’s own store list' : '') + '.</div></div>';
        dots.addLayer(L.circleMarker([it.lat, it.lon], { radius:4, color:'#fff', weight:1, fillColor:col, fillOpacity:.95 }).bindPopup(pop));
        const icon = DAY[cat] ? L.divIcon({ className:'', html:'<div class="day" style="background:' + col + '">' + DAY[cat][0] + '</div>', iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12] }) : logoIcon(it.brand, col, 28);
        badges.addLayer(L.marker([it.lat, it.lon], { icon, title:it.name || it.brand }).bindPopup(pop));
      });
      dotGroups[cat] = dots; badgeGroups[cat] = badges; groups[cat] = badges;
    });

    const on = new Set(DEFAULT_ON);
    function apply(){
      const z = map.getZoom();
      Object.keys(groups).forEach(k => {
        if (dotGroups[k]) {
          const wantDots = on.has(k) && z >= 10 && z < 12, wantBadges = on.has(k) && z >= 12;
          if (wantDots && !map.hasLayer(dotGroups[k])) dotGroups[k].addTo(map); if (!wantDots && map.hasLayer(dotGroups[k])) map.removeLayer(dotGroups[k]);
          if (wantBadges && !map.hasLayer(badgeGroups[k])) badgeGroups[k].addTo(map); if (!wantBadges && map.hasLayer(badgeGroups[k])) map.removeLayer(badgeGroups[k]);
        } else {
          if (on.has(k) && !map.hasLayer(groups[k])) groups[k].addTo(map);
          if (!on.has(k) && map.hasLayer(groups[k])) map.removeLayer(groups[k]);
        }
      });
      if (map.hasLayer(sites)) { map.removeLayer(sites); sites.addTo(map); }
    }
    map.on('zoomend', apply); apply();
    const pts = sorted.map(s => [s.lat, s.lon]);
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.12)); else if (data.territories && data.territories.length) map.fitBounds(terr.getBounds());

    const chips = document.getElementById('chips');
    function renderChips(){
      const counts = {}; sorted.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
      const allOn = Object.keys(STATUS).every(k => statusOn.has(k));
      let h = '<button class="chip all' + (allOn ? '' : ' dim') + '" data-all="1">All sites</button>';
      ORDER.forEach(k => { if (!counts[k]) return; h += '<button class="chip' + (statusOn.has(k) ? ' on' : '') + '" data-status="' + k + '" style="--c:' + STATUS[k] + '"><span class="dot"></span>' + esc(SHORT[k]) + ' <span class="n">' + counts[k] + '</span></button>'; });
      chips.innerHTML = h;
      chips.querySelectorAll('[data-status]').forEach(b => b.onclick = () => { const k = b.getAttribute('data-status'); if (statusOn.has(k)) statusOn.delete(k); else statusOn.add(k); applySites(); renderChips(); renderPanels(); });
      chips.querySelector('[data-all]').onclick = () => { const all = Object.keys(STATUS).every(k => statusOn.has(k)); statusOn.clear(); if (!all) Object.keys(STATUS).forEach(k => statusOn.add(k)); applySites(); renderChips(); renderPanels(); };
    }
    renderChips();

    let tab = 'sites', query = '';
    function tabsHtml(){ return ['sites','layers','about'].map(t => '<button data-tab="' + t + '"' + (tab === t ? ' class="on"' : '') + '>' + ({sites:'Sites', layers:'Layers', about:'About'})[t] + '</button>').join(''); }
    function sitesHtml(){
      const q = query.toLowerCase();
      const list = sorted.filter(s => statusOn.has(s.status) && (!q || [s.name, s.address, s.city, s.region, s.notes].join(' ').toLowerCase().includes(q)));
      let h = '<input class="search" id="q" type="search" placeholder="Search sites, streets, regions" value="' + esc(query) + '">';
      if (!list.length) h += '<div class="note">No sites match. Turn a status chip back on or clear the search.</div>';
      list.forEach(s => { h += '<div class="site" data-site="' + esc(s.id) + '"><div class="num" style="background:' + (STATUS[s.status]||'#888') + '">' + s._n + '</div><div><b>' + esc(s.name) + '<span class="tag" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(SHORT[s.status] || s.status) + '</span></b><div class="sub">' + esc(s.address) + ', ' + esc(s.city) + '<br>' + esc(s.region) + (s.region_who ? ' · ' + esc(s.region_who) : '') + '</div></div></div>'; });
      return h;
    }
    function logosStrip(brands){ const im = brands.filter(b => LOGOS[b]).slice(0,6).map(b => '<img src="' + LOGOS[b] + '" alt="" title="' + esc(b) + '">').join(''); return im ? '<span class="logos">' + im + '</span>' : ''; }
    function row(k, label, sw, n){ return '<label class="row"><input type="checkbox" data-layer="' + k + '"' + (on.has(k) ? ' checked' : '') + '>' + sw + '<span>' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</label>'; }
    function layersHtml(){
      const c = meta.counts || {};
      const brandsIn = cat => { const set = new Set(); (layers[cat] || []).forEach(i => i.brand && set.add(i.brand)); return [...set]; };
      let h = '<h3 class="sec">On the map</h3>';
      h += row('sites', 'Sites', '<span class="sw" style="background:' + STATUS.new + '"></span>', sorted.length);
      h += row('territories', 'Territories (approximate)', '<span class="sw" style="background:#3f60a0;opacity:.5"></span>', (data.territories || []).length);
      h += row('stores', 'Existing ' + esc(meta.client || '') + ' stores', clientLogo ? '<span class="logos"><img src="' + clientLogo + '" alt=""></span>' : '<span class="sw sq" style="background:#1b2a4a"></span>', (data.stores || []).length);
      h += row('pipeline', 'New development and anchors coming', '<span class="sw dia" style="background:#c04b8f"></span>', (data.pipeline || []).length);
      h += '<h3 class="sec">Anchors</h3>';
      ['grocery','bigbox','traffic'].forEach(k => { if ((layers[k] || []).length) h += row(k, CATL[k], logosStrip(brandsIn(k)) || '<span class="sw" style="background:' + CATC[k] + '"></span>', c[k]); });
      if ((layers.competitor || []).length) h += '<h3 class="sec">Competitors</h3>' + row('competitor', CATL.competitor, logosStrip(brandsIn('competitor')) || '<span class="sw" style="background:' + CATC.competitor + '"></span>', c.competitor);
      h += '<h3 class="sec">Daytime drivers</h3>';
      Object.keys(DAY).forEach(k => { if ((layers[k] || []).length) h += row(k, DAY[k][2], '<span class="sw" style="background:' + DAY[k][1] + '"></span>', c[k]); });
      h += '<div class="note" style="margin-top:10px">Anchors, competitors and daytime drivers appear as dots once you zoom in, and as logos when you zoom in further.</div>';
      return h;
    }
    function aboutHtml(){
      let h = '<div class="about"><p>' + esc(meta.subtitle || '') + '</p>';
      h += '<h3 class="sec">Pin colours</h3>'; ORDER.forEach(k => { h += '<div class="row"><span class="sw" style="background:' + STATUS[k] + '"></span>' + esc((meta.status_legend || {})[k] || k) + '</div>'; });
      h += '<h3 class="sec">Dates and sources</h3><p>Sites as of ' + fmt(meta.sites_as_of) + '. Anchors and competitors from OpenStreetMap contributors and the brands’ own store lists, pulled ' + fmt((meta.layers_as_of || {}).anchors) + '. Existing stores from the ' + esc(meta.client || '') + ' locator, ' + fmt((meta.layers_as_of || {}).stores) + '. Pipeline items are reported from public sources and not yet confirmed with the developer.</p>';
      h += '<p>' + esc(meta.territory_note || '') + '</p>';
      h += '<p><a class="btn ghost" href="#" id="printbtn">Print / save as PDF</a></p>';
      h += '<p class="note">' + esc(meta.contact_line || '') + '</p></div>';
      return h;
    }
    function wire(root){
      root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.getAttribute('data-tab'); renderPanels(); });
      const q = root.querySelector('#q'); if (q) q.oninput = () => { query = q.value; const pos = q.selectionStart; renderPanels(); const nq = root.querySelector('#q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); } };
      root.querySelectorAll('[data-site]').forEach(el => el.onclick = () => { const m = siteMarkers[el.getAttribute('data-site')]; if (!m) return; if (!on.has('sites')) { on.add('sites'); apply(); } map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); sheet.classList.remove('open'); });
      root.querySelectorAll('[data-layer]').forEach(cb => cb.onchange = () => { const k = cb.getAttribute('data-layer'); if (cb.checked) on.add(k); else on.delete(k); apply(); });
      const pb = root.querySelector('#printbtn'); if (pb) pb.onclick = e => { e.preventDefault(); window.print(); };
    }
    const panel = document.getElementById('panel'), sheet = document.getElementById('sheet');
    function renderPanels(){
      const body = tab === 'sites' ? sitesHtml() : tab === 'layers' ? layersHtml() : aboutHtml();
      if (document.body.classList.contains('desk')) { document.getElementById('ptabs').innerHTML = tabsHtml(); document.getElementById('pbody').innerHTML = body; wire(panel); }
      else { document.getElementById('stabs').innerHTML = tabsHtml(); document.getElementById('sbody').innerHTML = body; wire(sheet); }
    }
    document.getElementById('b-sites').onclick = () => { if (sheet.classList.contains('open') && tab === 'sites') sheet.classList.remove('open'); else { tab = 'sites'; renderPanels(); sheet.classList.add('open'); } };
    document.getElementById('b-layers').onclick = () => { if (sheet.classList.contains('open') && tab === 'layers') sheet.classList.remove('open'); else { tab = 'layers'; renderPanels(); sheet.classList.add('open'); } };
    map.on('click', () => sheet.classList.remove('open'));
    window.addEventListener('resize', () => { const d = window.innerWidth >= 900; if (d !== document.body.classList.contains('desk')) { document.body.classList.toggle('desk', d); renderPanels(); setTimeout(() => map.invalidateSize(), 60); } });
    renderPanels();

    let pv = '<h1>' + esc(meta.title || '') + '</h1><div>Sites as of ' + fmt(meta.sites_as_of) + '. ' + esc(meta.territory_note || '') + '</div><table><tr><th>#</th><th>Site</th><th>Status</th><th>Territory</th><th>Size</th><th>Asking</th><th>NNN</th><th>Traffic</th><th>Notes</th></tr>';
    sorted.forEach(s => { pv += '<tr><td>' + s._n + '</td><td>' + esc(s.name) + '<br>' + esc(s.address) + ', ' + esc(s.city) + '</td><td>' + esc(s.status_label) + '</td><td>' + esc(s.region) + (s.region_who ? '<br>' + esc(s.region_who) : '') + '</td><td>' + esc(sizeText(s)) + '</td><td>' + esc(rentText(s)) + '</td><td>' + esc(nnnText(s)) + '</td><td>' + esc(s.traffic || '') + '</td><td>' + esc(s.notes || '') + (s.brochure_url ? '<br>' + esc(s.brochure_url) : '') + '</td></tr>'; });
    pv += '</table><div style="margin-top:8px">' + esc(meta.contact_line || '') + '</div>';
    document.getElementById('printview').innerHTML = pv;
  }

  function sitePopup(s){
    let h = '<div class="pop"><h4>' + s._n + '. ' + esc(s.name) + '</h4>';
    h += '<div class="chipline"><span class="tag" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(s.status_label) + '</span><span class="tag grey">' + esc(s.region) + (s.region_who ? ' · ' + esc(s.region_who) : '') + '</span></div>';
    h += '<div class="addr">' + esc(s.address) + (s.corner ? ' (' + esc(s.corner) + ')' : '') + ', ' + esc(s.city) + (s.zip ? ' ' + esc(s.zip) : '') + '</div>';
    const cells = [['Size', sizeText(s)], ['Asking', rentText(s)], ['NNN', nnnText(s)], ['Traffic', s.traffic || '']].filter(c => c[1]);
    if (cells.length) h += '<div class="grid">' + cells.map(c => '<div><b>' + c[0] + '</b><span>' + esc(c[1]) + '</span></div>').join('') + '</div>';
    if (s.notes) h += '<div class="notes">' + esc(s.notes) + '</div>';
    h += '<div class="links">' + (s.brochure_url ? '<a href="' + esc(s.brochure_url) + '" target="_blank" rel="noopener noreferrer">' + esc(s.brochure_label || 'Brochure') + ' ↗</a>' : (s.brochure_label ? '<span class="tag grey">' + esc(s.brochure_label) + '</span>' : '')) + '<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.lat + ',' + s.lon) + '" target="_blank" rel="noopener noreferrer">Google Maps ↗</a></div></div>';
    return h;
  }
})();
</script>
</body>
</html>
