<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Port of Subs — Colorado site map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{
  --navy:#1b2a4a; --accent:#8a1f2d; --gold:#b8933a; --ink:#111827; --muted:#6b7280;
  --hair:rgba(0,0,0,.08); --bg:#f2f3f5;
  --new:#0a7aff; --go:#2fa84f; --hold:#f0a400; --pass:#8e8e93; --loi:#8e44e0; --lease:#f2711c; --executed:#0f8a4b;
  --grocery:#16a34a; --bigbox:#2563eb; --traffic:#9333ea; --competitor:#dc2626;
  --hospital:#0e7490; --university:#0f766e; --high_school:#0369a1; --military:#4b5563; --office_park:#7c2d12;
  --pipe:#c04b8f; --pipe-comp:#b91c1c;
  --r-sheet:20px; --r-card:16px; --r-btn:12px; --r-pill:999px;
  --shadow-float:0 8px 30px rgba(0,0,0,.18); --shadow-small:0 1px 2px rgba(0,0,0,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
  font-size:15px; line-height:1.3; font-variant-numeric:tabular-nums; }
button, input{ font:inherit; color:inherit; }
button{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
h1,h2,h3,h4,p{ margin:0; }
a{ color:inherit; }
::selection{ background:rgba(27,42,74,.18); }
.hidden{ display:none !important; }
.mobile-only{ }
body.desk .mobile-only{ display:none !important; }
.desk-only{ display:none !important; }
body.desk .desk-only{ display:flex !important; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* ---------- frosted surfaces ---------- */
.frost{ background:rgba(255,255,255,.88); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); }

/* ---------- map ---------- */
#map{ position:fixed; inset:0; background:#dfe3e8; }
.leaflet-container{ font-family:inherit; }
.leaflet-control-attribution{ font-size:9.5px !important; background:rgba(255,255,255,.7) !important; }
.leaflet-top.leaflet-right{ z-index:1090; }
body:not(.desk) .leaflet-control-zoom{ display:none; }
body.desk .leaflet-control-zoom{ margin-top:112px; margin-right:0; border:0; border-radius:var(--r-btn); overflow:hidden; box-shadow:var(--shadow-float); }
body.desk .leaflet-control-zoom a{ width:36px; height:36px; line-height:36px; background:#fff; color:var(--navy); border:0; font-size:18px; }
body.desk .leaflet-control-zoom a:first-child{ border-bottom:1px solid var(--hair); }
body.desk .leaflet-control-zoom a:hover{ background:#f4f5f7; }

/* ---------- lock screen ---------- */
#lock{ position:fixed; inset:0; z-index:2000; display:flex; align-items:center; justify-content:center; padding:24px;
  background:radial-gradient(120% 80% at 20% 0%, #26395f 0%, #1b2a4a 55%, #121c33 100%); }
#lock.away{ opacity:0; pointer-events:none; transition:opacity .2s var(--ease); }
.lockCol{ width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center; text-align:center; }
.lockBadge{ width:64px; height:64px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.35); flex:0 0 auto; }
.lockBadge img{ width:52px; height:52px; object-fit:contain; }
.lockBadge .ring{ width:100%; height:100%; border-radius:50%; border:3px solid var(--gold); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; color:var(--navy); letter-spacing:.02em; }
.lockTitle1{ margin-top:18px; font-size:28px; font-weight:700; color:#fff; line-height:1.2; }
.lockTitle2{ margin-top:4px; font-size:15px; color:rgba(255,255,255,.72); }
.lockCaption{ margin-top:10px; font-size:13px; color:rgba(255,255,255,.6); }
.lockForm{ width:100%; margin-top:26px; }
#pw{ width:100%; height:52px; border-radius:14px; border:0; padding:0 16px; font-size:16px; background:#fff; color:var(--ink); }
#pw::placeholder{ color:#9aa1ad; }
.lockBtn{ width:100%; height:50px; margin-top:12px; border:0; border-radius:14px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; }
.lockBtn:active{ filter:brightness(.94); }
.lockBtn:disabled{ opacity:.85; }
.lockErr{ min-height:18px; margin-top:10px; font-size:13px; color:var(--gold); font-weight:600; }
.lockRow{ margin-top:14px; display:flex; align-items:center; justify-content:center; gap:10px; color:rgba(255,255,255,.72); font-size:13px; }
.spin{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; flex:0 0 auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.shake{ animation:shake .3s; }
@keyframes shake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(6px); } }
.lockAuto{ display:flex; flex-direction:column; align-items:center; margin-top:26px; }

/* iOS-style switch */
.switch{ position:relative; display:inline-flex; width:46px; height:28px; flex:0 0 auto; }
.switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
.switch .track{ position:absolute; inset:0; background:#d7dae0; border-radius:999px; transition:background .16s var(--ease); }
.switch .thumb{ position:absolute; top:2px; left:2px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .16s var(--ease); }
.switch input:checked + .track{ background:var(--go); }
.switch input:checked + .track .thumb{ transform:translateX(18px); }
.lockRow .switch .track{ background:rgba(255,255,255,.3); }
.lockRow .switch input:checked + .track{ background:var(--go); }

/* ---------- title pill (phone) ---------- */
#titlePill{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:10px; z-index:1300;
  height:44px; border-radius:var(--r-pill); box-shadow:var(--shadow-small); display:flex; align-items:center; gap:8px; padding:0 12px 0 4px; max-width:64%;
  transition:opacity .18s var(--ease); }
#titlePill.fade, #topRight.fade{ opacity:0; pointer-events:none; }
#titlePill .logo{ width:28px; height:28px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; box-shadow:0 0 0 1px var(--hair) inset; }
#titlePill .logo img{ width:22px; height:22px; object-fit:contain; }
#titlePill .logo b{ font-size:10px; color:var(--navy); font-weight:700; }
#titlePill .tx{ min-width:0; }
#titlePill .name{ font-size:15px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#titlePill .cap{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px; }

/* ---------- top-right stack ---------- */
#topRight{ position:fixed; top:calc(10px + env(safe-area-inset-top)); right:10px; z-index:1300; display:flex; flex-direction:column; align-items:flex-end; gap:10px;
  transition:opacity .18s var(--ease); }
body.desk #topRight{ top:12px; right:12px; }
.segpill{ height:36px; border-radius:var(--r-pill); box-shadow:var(--shadow-small); display:inline-flex; padding:3px; gap:2px; }
.segpill button{ border:0; background:transparent; color:var(--navy); font-size:13px; font-weight:600; border-radius:var(--r-pill); padding:0 14px; height:100%; }
.segpill button.on{ background:var(--navy); color:#fff; }
.roundbtn{ width:44px; height:44px; border-radius:50%; border:0; box-shadow:var(--shadow-small); display:flex; align-items:center; justify-content:center; color:var(--navy); flex:0 0 auto; }
.roundbtn:active{ filter:brightness(.94); }
body.desk .roundbtn{ width:44px; height:44px; }

/* ---------- Show-on-the-map popover ---------- */
#popover{ position:fixed; z-index:1400; width:min(320px, calc(100vw - 20px)); border-radius:16px; box-shadow:var(--shadow-float); padding:6px 0 10px; opacity:0; transform:translateY(-6px) scale(.98); pointer-events:none; transition:opacity .16s var(--ease), transform .16s var(--ease); max-height:min(70vh, 560px); overflow-y:auto; }
#popover.open{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.popHead{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px 8px; }
.popHead h3{ font-size:15px; font-weight:600; }
.popClose{ width:28px; height:28px; border-radius:50%; border:0; background:#eef0f3; color:var(--muted); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.togRow{ display:flex; align-items:center; gap:10px; padding:8px 14px; min-height:44px; }
.togLeft{ flex:0 0 auto; display:flex; }
.togDot{ width:14px; height:14px; border-radius:50%; }
.togLogos{ display:inline-flex; gap:4px; }
.togLogos img{ width:20px; height:20px; object-fit:contain; border-radius:5px; background:#fff; box-shadow:0 0 0 1px var(--hair); }
.togLabel{ flex:1; min-width:0; font-size:14px; font-weight:600; }
.togCount{ font-size:12px; color:var(--muted); margin-right:2px; }
.dayLetters{ display:flex; gap:2px; }
.dayLetters span{ width:15px; height:15px; border-radius:50%; color:#fff; font-size:8px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.popCaption{ font-size:12px; color:var(--muted); line-height:1.5; padding:8px 14px 2px; }

/* ---------- sheet (phone) & panel (mac) ---------- */
#sheet{ position:fixed; left:0; right:0; bottom:0; z-index:1200; border-radius:var(--r-sheet) var(--r-sheet) 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.18);
  display:flex; flex-direction:column; will-change:transform; touch-action:none; }
body.desk #sheet{ display:none !important; }
#panel{ display:none; position:fixed; top:12px; left:12px; bottom:12px; width:380px; z-index:1150; border-radius:var(--r-sheet); box-shadow:var(--shadow-float); flex-direction:column; overflow:hidden; }
body.desk #panel{ display:flex; }

.grabWrap{ flex:0 0 auto; display:flex; justify-content:center; padding:8px 0 2px; touch-action:none; }
.grab{ width:36px; height:5px; border-radius:3px; background:#cfd4dd; }
.sheetHead, .panelHead{ flex:0 0 auto; padding:2px 16px 10px; touch-action:none; }
.panelHead{ padding-top:16px; touch-action:auto; }
.sheetBody, .panelBody{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px calc(20px + env(safe-area-inset-bottom)); overscroll-behavior:contain; }

/* list header */
.hRow{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; padding-top:6px; }
.hRow h2{ font-size:17px; font-weight:600; }
.hStamp{ font-size:13px; color:var(--muted); white-space:nowrap; }

.sinceStrip{ margin-top:10px; background:#e8f1ff; border-radius:12px; padding:10px 12px; display:flex; align-items:flex-start; gap:8px; font-size:13px; line-height:1.45; color:var(--ink); }
.sinceStrip .txt{ flex:1; }
.sinceStrip .showPill{ flex:0 0 auto; background:var(--navy); color:#fff; border:0; border-radius:999px; padding:5px 12px; font-size:12.5px; font-weight:600; }
.sinceStrip .xbtn{ flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:0; background:rgba(0,0,0,.06); color:var(--muted); display:flex; align-items:center; justify-content:center; }

.searchWrap{ margin-top:10px; position:relative; }
.searchWrap svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#9aa1ad; pointer-events:none; }
#searchInput{ width:100%; height:40px; border-radius:12px; border:0; background:#eceef2; padding:0 36px; font-size:16px; color:var(--ink); }
#searchInput::placeholder{ color:#9aa1ad; }
.searchClear{ position:absolute; right:6px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; border:0; background:transparent; color:#9aa1ad; display:flex; align-items:center; justify-content:center; }

.pillRow{ margin-top:10px; display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.pillRow::-webkit-scrollbar{ display:none; }
.fpill{ flex:0 0 auto; height:32px; display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:0 14px; font-size:13px; font-weight:600; background:#fff; color:var(--ink); border:1px solid var(--hair); }
.fpill .d{ width:8px; height:8px; border-radius:50%; }
.fpill.sel{ background:var(--navy); color:#fff; border-color:var(--navy); }
.fpill.sel .d{ background:#fff !important; }

.rows{ margin-top:4px; }
.siteRow{ display:flex; align-items:center; gap:12px; padding:12px 2px; border-bottom:1px solid var(--hair); min-height:72px; }
.siteRow:active{ background:rgba(0,0,0,.03); }
.siteRow.kbd{ background:#eef2fb; border-radius:12px; }
.numBub{ width:30px; height:30px; border-radius:50%; color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.rowMid{ flex:1; min-width:0; }
.rowMid .nm{ font-size:15px; font-weight:600; line-height:1.28; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.rowMid .ad{ font-size:13px; color:var(--muted); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:1px; }
.rowMid .te{ font-size:12px; color:var(--muted); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:1px; }
.rowRight{ flex:0 0 auto; max-width:96px; text-align:right; }
.rowRight .since{ font-size:10.5px; font-weight:700; color:var(--new); text-transform:uppercase; letter-spacing:.03em; }
.rowRight .st{ font-size:12px; font-weight:700; white-space:nowrap; }
.rowRight .sz{ font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; }

.emptyState{ padding:36px 10px; text-align:center; color:var(--muted); font-size:13px; }
.emptyState .showAll{ margin-top:12px; display:inline-block; background:var(--navy); color:#fff; border:0; border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; }

.aboutFoot{ margin-top:14px; padding-top:6px; border-top:1px solid var(--hair); }
details.about{ }
details.about summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--muted); padding:8px 0; }
details.about summary::-webkit-details-marker{ display:none; }
details.about summary .chev{ transition:transform .16s var(--ease); color:#9aa1ad; }
details.about[open] summary .chev{ transform:rotate(90deg); }
.aboutBody{ font-size:12px; color:var(--muted); line-height:1.55; padding-bottom:8px; }
.aboutBody .legend{ display:flex; align-items:center; gap:8px; margin:6px 0; }
.aboutBody .legend .d{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
.aboutBody p{ margin:8px 0; }
.printLink{ display:inline-block; margin:6px 0; color:var(--navy); font-weight:600; text-decoration:underline; }
.contactLine{ margin-top:6px; padding-bottom:10px; }

/* ---------- card ---------- */
.cardHead{ display:flex; align-items:center; justify-content:space-between; padding-top:4px; }
.navBtn{ width:36px; height:36px; border-radius:50%; border:0; background:rgba(0,0,0,.06); color:var(--navy); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.navBtn:disabled{ opacity:.3; }
.cardHead .nb2{ display:flex; gap:8px; }
.posInd{ font-size:12px; color:var(--muted); font-weight:600; }

.cardWrap{ animation:cardIn .22s var(--ease); }
@keyframes cardIn{ from{ opacity:0; transform:translateX(24px); } to{ opacity:1; transform:translateX(0); } }

.cTitleRow{ display:flex; align-items:flex-start; gap:10px; margin-top:8px; padding-right:12px; }
.cTitleRow .numBub{ margin-top:2px; }
.cTitleRow h2{ font-size:20px; font-weight:700; line-height:1.25; }

.pillLine{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.statusPill{ display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:999px; color:#fff; font-size:12.5px; font-weight:700; }
.regionPill{ display:inline-flex; align-items:center; height:26px; padding:0 12px; border-radius:999px; background:#eef0f3; color:var(--ink); font-size:12.5px; font-weight:600; }

.cAddr{ font-size:15px; color:var(--muted); margin-top:10px; }

.terrBlock{ margin-top:14px; background:#f4f5f7; border-radius:var(--r-card); padding:12px 14px; }
.terrBlock.tap{ cursor:pointer; }
.terrBlock .cap{ font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); font-weight:700; }
.terrBlock .rg{ font-size:15px; margin-top:4px; font-weight:600; }
.terrBlock .who{ font-size:13px; color:var(--muted); margin-top:2px; }

.factsRow{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
.tile{ flex:1 1 88px; background:#f4f5f7; border-radius:var(--r-card); padding:10px 12px; }
.tile .v{ font-size:17px; font-weight:700; }
.tile .c{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
.factLine{ margin-top:10px; }
.factLine .c{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
.factLine .v{ font-size:14px; margin-top:2px; line-height:1.4; }

.noteBlock{ margin-top:14px; border-left:3px solid var(--gold); padding:2px 0 2px 12px; }
.noteBlock .cap{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; }
.noteBlock .tx{ font-size:15px; margin-top:3px; line-height:1.4; }

.nearWrap{ margin-top:16px; }
.nearWrap .cap{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; }
.nearLine{ display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13.5px; line-height:1.5; flex-wrap:wrap; }
.nearLine .badges{ display:inline-flex; margin-right:2px; }
.nearLine img{ width:18px; height:18px; object-fit:contain; border-radius:5px; background:#fff; box-shadow:0 0 0 1px var(--hair); margin-left:-5px; }
.nearLine img:first-child{ margin-left:0; }
.comeRow{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13.5px; padding:2px 0; }
.comeRow svg{ color:#9aa1ad; flex:0 0 auto; }
.comeRow .tx{ flex:1; }
.nearNone{ font-size:13px; color:var(--muted); margin-top:8px; }

.actionRow{ display:flex; gap:10px; margin-top:18px; }
.abtn{ flex:1; height:48px; border-radius:var(--r-btn); border:0; display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:600; text-decoration:none; }
.abtn.pri{ background:var(--navy); color:#fff; }
.abtn.ghost{ background:#fff; color:var(--navy); border:1px solid var(--hair); }
.brochureCap{ flex:1; height:48px; border-radius:var(--r-btn); background:#f4f5f7; color:var(--muted); font-size:13px; font-weight:600; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 8px; }
.cardBottomPad{ height:12px; }

/* ---------- leaflet popups ---------- */
.leaflet-popup-content-wrapper{ border-radius:14px; box-shadow:var(--shadow-float); padding:0; }
.leaflet-popup-content{ margin:0; }
.leaflet-popup-tip{ box-shadow:none; }
.pop{ padding:12px 14px; font-size:13px; line-height:1.42; min-width:200px; max-width:280px; }
.pop h4{ font-size:15px; font-weight:700; color:var(--navy); margin-bottom:4px; }
.poppills{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:6px; }
.ppill{ display:inline-flex; align-items:center; height:20px; padding:0 9px; border-radius:999px; color:#fff; font-size:10.5px; font-weight:700; }
.ppill.grey{ background:#eef0f3; color:var(--ink); }
.popaddr{ color:var(--muted); margin-bottom:4px; }
.popsum{ margin:4px 0; }
.popsum.clamp{ display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.moreBtn{ border:0; background:transparent; color:var(--navy); font-size:12px; font-weight:700; padding:0; margin-bottom:4px; }
.popsrc{ font-size:11px; color:var(--muted); margin-top:4px; }
.terr-label{ background:rgba(255,255,255,.85); border:1px solid rgba(0,0,0,.15); border-radius:999px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--ink); white-space:nowrap; box-shadow:0 1px 3px rgba(0,0,0,.12); }
.leaflet-interactive{ transition:fill-opacity .45s ease; }

/* ---------- map icons ---------- */
.pin{ border-radius:50% 50% 50% 0; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
.pin span{ transform:rotate(45deg); color:#fff; font-weight:700; }
.pinDot{ border-radius:50%; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.35); }
.badge{ border-radius:50%; background:#fff; box-shadow:0 1px 4px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.badge img{ width:76%; height:76%; object-fit:contain; }
.badge.txt{ font-weight:700; color:#fff; }
.storeIcon{ border-radius:50%; background:#fff; border:2px solid var(--navy); box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; overflow:hidden; }
.storeIcon img{ width:70%; height:70%; object-fit:contain; }
.storeIcon.txt{ background:var(--navy); color:#fff; font-weight:700; font-size:10px; }
.pipeIcon{ border-radius:50%; background:#fff; border:2px solid var(--pipe); box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; color:var(--ink); }
.pipeIcon.comp{ border-color:var(--pipe-comp); }
.dayIcon{ border-radius:50%; border:2px solid #fff; color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35); }

#printview{ display:none; }
@media print{
  #lock, #titlePill, #topRight, #popover, #sheet, #panel, .leaflet-control-container{ display:none !important; }
  #map{ position:relative !important; height:62vh !important; page-break-after:always; }
  #printview{ display:block; padding:12px; font-size:11px; }
  #printview table{ border-collapse:collapse; width:100%; }
  #printview th, #printview td{ border:1px solid #bbb; padding:4px 6px; vertical-align:top; text-align:left; }
}
</style>

'use strict';
const SLUG = location.pathname.replace(/[^a-z0-9]/gi,'').slice(-24) || 'clientmap';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let LOGOS = {}; try { LOGOS = JSON.parse(document.getElementById('logos').textContent || '{}'); } catch (e) {}

/* ============================================================ icons */
const SVG = {
  chevL:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',

  close:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>',
  layers:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5l8.5 4.5-8.5 4.5-8.5-4.5 8.5-4.5z"/><path d="M3.5 12.5l8.5 4.5 8.5-4.5"/><path d="M3.5 16.5l8.5 4.5 8.5-4.5"/></svg>',
  construction:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18h14"/><path d="M6.5 18a5.5 5.5 0 0 1 11 0"/><path d="M12 9v4"/></svg>'
};

/* ============================================================ constants */
const STATUS = { new:'var(--new)', go:'var(--go)', hold:'var(--hold)', pass:'var(--pass)', loi:'var(--loi)', lease:'var(--lease)', executed:'var(--executed)' };
const STATUSHEX = { new:'#0a7aff', go:'#2fa84f', hold:'#f0a400', pass:'#8e8e93', loi:'#8e44e0', lease:'#f2711c', executed:'#0f8a4b' };
const ORDER = ['executed','lease','loi','go','hold','new','pass'];
const SHORT = { new:'New', go:'Go', hold:'On hold', pass:'Passed', loi:'LOI', lease:'Lease', executed:'Executed' };
const CATC = { grocery:'#16a34a', bigbox:'#2563eb', traffic:'#9333ea', competitor:'#dc2626' };
const CATL = { grocery:'Grocery', bigbox:'Big box and club', competitor:'Sandwich competitors', traffic:'Traffic drivers' };
const DAY = { hospital:['H','#0e7490','Hospitals and medical campuses'], university:['U','#0f766e','Universities and colleges'], high_school:['S','#0369a1','High schools'], military:['M','#4b5563','Military installations'], office_park:['O','#7c2d12','Office parks and campuses'] };
const DAY_KEYS = Object.keys(DAY);
const CONTEXT_CATS = ['grocery','bigbox','traffic','competitor'].concat(DAY_KEYS);
const fmtShort = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('en-US', { month:'short', day:'numeric' }); };
const sizeText = s => s.size_sf ? Math.round(s.size_sf).toLocaleString() + ' SF' : (s.size_text || '');
const sizeNumOnly = s => s.size_sf ? Math.round(s.size_sf).toLocaleString() + ' SF' : '';
const rentText = s => s.rent_psf ? '$' + s.rent_psf.toFixed(2) + '/SF' : (s.rent_text || '');
const nnnText = s => s.nnn_psf ? '$' + s.nnn_psf.toFixed(2) + '/SF' : (s.nnn_text || '');
const kindLabel = k => ({'development':'New development','anchor-opening':'Anchor opening','anchor-announced':'Anchor announced','competitor-opening':'Competitor opening','land-purchase':'Land purchase'})[k] || (k || '');
function haversineMi(lat1, lon1, lat2, lon2){
  const R = 3958.7613, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function distText(mi){ const v = mi < 0.1 ? 0.1 : Math.round(mi*10)/10; return v.toFixed(1) + ' mi'; }
function logosStrip(brands, max){
  const im = brands.filter(b => LOGOS[b]).slice(0, max || 5).map(b => '<img src="' + LOGOS[b] + '" alt="" title="' + esc(b) + '">').join('');
  return im ? '<span class="togLogos">' + im + '</span>' : '';
}

/* ============================================================ lock screen */
const TITLE = document.title || '';
(function setupLock(){
  const parts = TITLE.split(' — ');
  const first = (parts[0] || TITLE).trim();
  document.getElementById('lockTitle1').textContent = first;
  document.getElementById('lockTitle2').textContent = parts.slice(1).join(' — ');
  const logo = LOGOS[first];
  if (logo) document.getElementById('lockBadge').innerHTML = '<img src="' + logo + '" alt="">';
})();

const lockEl = document.getElementById('lock'), pwEl = document.getElementById('pw'), errEl = document.getElementById('lockErr');
const lockFormEl = document.getElementById('lockForm'), lockAutoEl = document.getElementById('lockAuto');
const lockBtn = document.getElementById('lockBtn'), lockBtnLabel = document.getElementById('lockBtnLabel');

async function unlock(pw){
  const v = JSON.parse(document.getElementById('sealed').textContent);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(v.salt), iterations:v.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(v.nonce)}, key, b64(v.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function setOpening(on){
  lockBtn.disabled = on;
  lockBtnLabel.innerHTML = on ? '<span class="spin" style="border-color:rgba(255,255,255,.5);border-top-color:#fff"></span> Opening…' : 'Open';
}
async function tryOpen(pw, remember, auto){
  if (auto) { lockFormEl.classList.add('hidden'); lockAutoEl.classList.remove('hidden'); } else setOpening(true);
  errEl.textContent = '';
  try {
    const data = await unlock(pw);
    if (remember) localStorage.setItem('cm-pw-' + SLUG, pw); else localStorage.removeItem('cm-pw-' + SLUG);
    lockEl.classList.add('away');
    setTimeout(() => { lockEl.style.display = 'none'; }, 220);
    initApp(data);
  } catch (e) {
    localStorage.removeItem('cm-pw-' + SLUG);
    if (auto) { lockAutoEl.classList.add('hidden'); lockFormEl.classList.remove('hidden'); }
    setOpening(false);
    errEl.textContent = 'That passphrase didn’t work.';
    pwEl.classList.add('shake'); pwEl.value = '';
    setTimeout(() => pwEl.classList.remove('shake'), 320);
    pwEl.focus();
  }
}
lockFormEl.addEventListener('submit', e => { e.preventDefault(); const v = pwEl.value.trim(); if (v) tryOpen(v, document.getElementById('remember').checked, false); });
const savedPw = localStorage.getItem('cm-pw-' + SLUG);
if (savedPw) tryOpen(savedPw, true, true);

/* ============================================================ map (initialised immediately, underneath the lock) */
let map, aerialLayer, streetLayer;
function initMap(){
  map = L.map('map', { zoomControl:false, preferCanvas:true, attributionControl:true }).setView([39.55,-104.9], 9);
  L.control.zoom({ position:'topright' }).addTo(map);
  aerialLayer = L.layerGroup([
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imagery: Esri, Maxar, Earthstar Geographics' }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, opacity:.9 }),
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 })
  ]).addTo(map);
  streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Map: Esri, HERE, Garmin, OpenStreetMap contributors' });
  document.getElementById('segAerial').onclick = () => { map.removeLayer(streetLayer); if (!map.hasLayer(aerialLayer)) aerialLayer.addTo(map); setSeg(true); };
  document.getElementById('segStreet').onclick = () => { map.removeLayer(aerialLayer); if (!map.hasLayer(streetLayer)) streetLayer.addTo(map); setSeg(false); };
}
function setSeg(aerialOn){
  document.getElementById('segAerial').classList.toggle('on', aerialOn);
  document.getElementById('segStreet').classList.toggle('on', !aerialOn);
}
initMap();

/* ============================================================ layout mode */
function isDesk(){ return window.innerWidth >= 900; }
function safeTop(){ return document.getElementById('safeTopProbe').offsetHeight; }
function safeBot(){ return document.getElementById('safeBotProbe').offsetHeight; }

/* ============================================================ app state (post-unlock) */
let DATA=null, META={}, SORTED=[], siteMarkers={}, territoryLayers={}, storeMarkers=[], pipelineMarkers={};
let contextGroups={}, contextRaw={};
let ON = new Set(['territories','stores','pipeline','grocery','competitor']);
let view = 'list';        // 'list' | 'card'
let current = null;       // selected site object
let activeFilter = null;  // null | status key | 'changed'
let query = '';
let sinceMap = new Map(); // id -> 'added' | 'changed'
let sincePrev = null;
let stripDismissed = false;
let lastSiteTier = null;
let highlightIndex = -1;
let popoverOpen = false;

function visibleSites(){
  const q = query.trim().toLowerCase();
  return SORTED.filter(s => {
    if (activeFilter === 'changed') { if (!sinceMap.has(s.id)) return false; }
    else if (activeFilter) { if (s.status !== activeFilter) return false; }
    if (q) {
      const hay = [s.name, s.address, s.city, s.region, s.region_who, s.notes].filter(Boolean).join(' ').toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function fitPadding(){
  if (document.body.classList.contains('desk')) return { paddingTopLeft:L.point(380 + 24, 24), paddingBottomRight:L.point(24, 24) };
  return { paddingTopLeft:L.point(24, 24), paddingBottomRight:L.point(0, window.innerHeight * 0.5 + 24) };
}
function fitToSites(sites){
  const pts = (sites || []).map(s => [s.lat, s.lon]);
  if (!pts.length) return false;
  map.fitBounds(L.latLngBounds(pts), Object.assign({ maxZoom:16 }, fitPadding()));
  return true;
}
function initApp(data){
  DATA = data; META = data.meta || {};
  document.body.classList.toggle('desk', isDesk());
  document.getElementById('titlePill').classList.remove('hidden');
  document.getElementById('topRight').classList.remove('hidden');

  const logo = LOGOS[META.client];
  const pillLogo = document.getElementById('pillLogo');
  pillLogo.innerHTML = logo ? '<img src="' + logo + '" alt="">' : '<b>FFR</b>';
  document.getElementById('pillName').textContent = META.client || META.title || '';

  SORTED = (data.sites || []).slice().sort((a,b) => ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.name.localeCompare(b.name));
  SORTED.forEach((s,i) => s._n = i + 1);

  computeSince();

  buildTerritories();
  buildSites();
  buildStores();
  buildPipeline();
  buildContext();

  map.on('zoomend', onZoomEnd);
  map.on('moveend', scheduleContextUpdate);
  map.on('click', onMapBackgroundClick);
  onZoomEnd();
  scheduleContextUpdate();

  if (!fitToSites(SORTED)) {
    if (data.territories && data.territories.length) { const b = territoryBounds(); if (b) map.fitBounds(b, fitPadding()); }
  }
  if (map.getZoom() < 9) map.setZoom(9);

  wireChrome();
  paint();
  buildPrintView();
}

/* ============================================================ territories */

  return b;
}
function buildTerritories(){
  const grp = L.layerGroup();
  (DATA.territories || []).forEach(t => {
    const col = t.colour || '#3f60a0';

function updateTerritoryLabels(){
  const show = map.getZoom() >= 10;
  (DATA.territories || []).forEach(t => {
    const lyr = territoryLayers[t.id]; if (!lyr) return;
    const has = !!lyr.getTooltip();
    if (show && !has) lyr.bindTooltip(esc(t.short) + ' · ' + esc(t.developer), { permanent:true, direction:'center', className:'terr-label', interactive:false });

function pulseTerritory(ids){

/* ============================================================ since-you-last-opened */
function computeSince(){
  const key = 'cm-seen-' + SLUG;
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(key) || 'null'); } catch(e){}
  sincePrev = prev;
  let added = 0, changed = 0, removed = 0;
  if (prev && prev.sites) {
    const curIds = new Set(SORTED.map(s => s.id));
    SORTED.forEach(s => {
      if (!(s.id in prev.sites)) { sinceMap.set(s.id, 'added'); added++; }
      else if (prev.sites[s.id] !== s.status) { sinceMap.set(s.id, 'changed'); changed++; }
    });
    Object.keys(prev.sites).forEach(id => { if (!curIds.has(id)) removed++; });
  }
  const snap = { when: new Date().toISOString(), sites:{} };
  SORTED.forEach(s => snap.sites[s.id] = s.status);
  try { localStorage.setItem(key, JSON.stringify(snap)); } catch(e){}
  window.__sinceInfo = { added, changed, removed, prevWhen: prev ? prev.when : null };
}

/* ============================================================ nearby (computed) */
function nearbyFor(site){
  const lat = site.lat, lon = site.lon;
  const withDist = (arr) => arr.map(it => ({ it, d: haversineMi(lat, lon, it.lat, it.lon) }));

  const anchorItems = ['grocery','bigbox','traffic'].reduce((a,c) => a.concat(contextRaw[c] || []), []);
  let anchors = withDist(anchorItems).filter(x => x.d <= 2.0).sort((a,b) => a.d - b.d);
  const seenBrand = new Set(); const anchorPicks = [];
  anchors.forEach(x => { const b = x.it.brand || x.it.name; if (seenBrand.has(b)) return; seenBrand.add(b); anchorPicks.push(x); });
  const anchorLine = anchorPicks.slice(0,5).map(x => esc(x.it.brand || x.it.name) + ' ' + distText(x.d)).join(' · ');

  const comp = withDist(contextRaw.competitor || []).filter(x => x.d <= 1.5);
  const compGroups = {};
  comp.forEach(x => {
    const b = x.it.brand || x.it.name || 'Competitor';
    if (!compGroups[b]) compGroups[b] = { count:0, d:x.d };
    compGroups[b].count++;
    if (x.d < compGroups[b].d) compGroups[b].d = x.d;
  });
  const compBrands = Object.keys(compGroups).sort((a,b) => compGroups[a].d - compGroups[b].d);
  const compLine = compBrands.map(b => esc(b) + (compGroups[b].count > 1 ? ' ×' + compGroups[b].count : '') + ' ' + distText(compGroups[b].d)).join(', ');
  const compTotal = comp.length;

  const driverItems = ['hospital','university','military','office_park'].reduce((a,c) => a.concat(contextRaw[c] || []), []);
  const drivers = withDist(driverItems).filter(x => x.d <= 2.5).sort((a,b) => a.d - b.d).slice(0,3);
  const driverLine = drivers.map(x => esc(x.it.name || x.it.brand) + ' ' + distText(x.d)).join(' · ');

  let nearestStore = null;
  (DATA.stores || []).forEach(st => { const d = haversineMi(lat, lon, st.lat, st.lon); if (!nearestStore || d < nearestStore.d) nearestStore = { st, d }; });
  const storeLine = nearestStore ? esc(META.client || 'Store') + (nearestStore.st.store_no ? ' #' + esc(nearestStore.st.store_no) : '') + ' ' + esc(nearestStore.st.city || '') + ' · ' + distText(nearestStore.d) : '';

  const coming = withDist(DATA.pipeline || []).filter(x => x.d <= 5.0).sort((a,b) => a.d - b.d).slice(0,3);

  const nothing = !anchorLine && !compLine && !driverLine && !storeLine && !coming.length;
  return { anchorLine, compLine, compTotal, driverLine, storeLine, coming, nothing };
}
function renderNearby(site){
  const n = nearbyFor(site);
  if (n.nothing) return '<div class="nearWrap"><div class="cap">Nearby</div><div class="nearNone">Nothing on the map within two miles.</div></div>';
  let h = '<div class="nearWrap"><div class="cap">Nearby</div>';
  if (n.anchorLine) h += '<div class="nearLine">' + n.anchorLine + '</div>';
  if (n.compLine) h += '<div class="nearLine">' + n.compTotal + ' sandwich competitor' + (n.compTotal === 1 ? '' : 's') + ' within a mile and a half: ' + n.compLine + '</div>';
  if (n.driverLine) h += '<div class="nearLine">' + n.driverLine + '</div>';
  if (n.storeLine) h += '<div class="nearLine">Nearest ' + n.storeLine + '</div>';
  n.coming.forEach(x => { h += '<div class="comeRow" data-fly-pipeline="' + esc(x.it.id) + '"><span class="tx">' + esc(x.it.title) + ' · ' + distText(x.d) + '</span>' + SVG.chevRsm + '</div>'; });
  h += '</div>';
  return h;
}

    if (val.length > 16) lines.push([label, val]); else tiles.push([label, val]);
  });
  if (tiles.length) { h += '<div class="factsRow">'; tiles.forEach(([label,val]) => { h += '<div class="tile"><div class="v">' + esc(val) + '</div><div class="c">' + label + '</div></div>'; }); h += '</div>'; }
  lines.forEach(([label,val]) => { h += '<div class="factLine"><div class="c">' + label + '</div><div class="v">' + esc(val) + '</div></div>'; });
  if (s.traffic) h += '<div class="factLine"><div class="c">Traffic</div><div class="v">' + esc(s.traffic) + '</div></div>';

  if (s.notes) h += '<div class="noteBlock"><div class="cap">Note from Andrew</div><div class="tx">' + esc(s.notes) + '</div></div>';

  h += renderNearby(s);

  h += '<div class="actionRow">';
  if (s.brochure_url) h += '<a class="abtn pri" href="' + esc(s.brochure_url) + '" target="_blank" rel="noopener noreferrer">Brochure</a>';
  else if (s.brochure_label) h += '<div class="brochureCap">' + esc(s.brochure_label) + '</div>';
  const isApple = navigator.vendor && navigator.vendor.indexOf('Apple') !== -1;
  const dest = isApple ? 'https://maps.apple.com/?daddr=' + s.lat + ',' + s.lon + '&q=' + encodeURIComponent(s.name)
                       : 'https://www.google.com/maps/dir/?api=1&destination=' + s.lat + ',' + s.lon;
  h += '<a class="abtn ghost" href="' + dest + '" target="_blank" rel="noopener noreferrer">Directions</a>';
  h += '</div><div class="cardBottomPad"></div></div>';
  return h;
}

/* ============================================================ paint dispatcher */
function activeContainers(){
  const desk = document.body.classList.contains('desk');
  return desk ? { head:document.getElementById('panelHead'), body:document.getElementById('panelBody') }
              : { head:document.getElementById('sheetHead'), body:document.getElementById('sheetBody') };
}
function paint(keepScroll){
  const { head, body } = activeContainers();
  const scrollTop = keepScroll ? body.scrollTop : 0;
  if (view === 'card' && current) {
    head.innerHTML = cardHeaderHTML(current);
    body.innerHTML = cardBodyHTML(current);
  } else {
    head.innerHTML = renderListHeader();
    body.innerHTML = renderListBody();
  }
  body.scrollTop = scrollTop;
  updateTitlePillCaption();
  recomputeDetents();
  repaintSitePins();
}
function updateTitlePillCaption(){
  const n = visibleSites().length;
  document.getElementById('pillCaption').textContent = n + ' site' + (n === 1 ? '' : 's') + ' · updated ' + fmtShort(META.sites_as_of);
}

/* ============================================================ open / close card, previous / next */
function offsetLatLng(latlng, zoom, dyPixels){
  const pt = map.project(latlng, zoom);
  pt.y += dyPixels;
  return map.unproject(pt, zoom);
}
function flyToSite(site){
  const zoom = Math.max(map.getZoom(), 14);
  if (!document.body.classList.contains('desk')) {
    const halfPx = window.innerHeight * 0.5;
    const target = offsetLatLng(L.latLng(site.lat, site.lon), zoom, halfPx / 2);
    map.flyTo(target, zoom, { duration:0.8 });
  } else {
    map.flyTo([site.lat, site.lon], zoom, { duration:0.8 });
  }
}
function openCard(site){
  const wasCard = view === 'card';
  view = 'card'; current = site;
  if (!wasCard) { try { history.pushState({ cm:1 }, ''); } catch(e){} } else { try { history.replaceState({ cm:1 }, ''); } catch(e){} }
  map.closePopup();
  snapTo('half');
  paint();
  flyToSite(site);
}
function closeCard(){
  view = 'list'; current = null;
  paint();
  repaintSitePins();
}
window.addEventListener('popstate', () => { if (view === 'card') closeCard(); });
function stepCard(dir){
  const list = visibleSites();
  const idx = list.findIndex(s => s.id === current.id);
  const next = idx + dir;
  if (next < 0 || next >= list.length) return;
  current = list[next];
  try { history.replaceState({ cm:1 }, ''); } catch(e){}
  paint();
  flyToSite(current);
}

/* ============================================================ sheet detents (phone) */
let detent = 'half', sheetFullPx = 0, dragging = null;
const sheetEl = document.getElementById('sheet');
function updateChromeForDetent(name){
  const full = name === 'full' && !document.body.classList.contains('desk');
  document.getElementById('titlePill').classList.toggle('fade', full);
  document.getElementById('topRight').classList.toggle('fade', full);
  if (full && popoverOpen) closePopover();
}
function recomputeDetents(){
  if (document.body.classList.contains('desk')) return;
  sheetFullPx = window.innerHeight - safeTop() - 8;
  sheetEl.style.height = sheetFullPx + 'px';
  applyDetentPx(detentPx(detent), false);
  updateChromeForDetent(detent);
}
function headerNaturalPx(){
  const h = document.getElementById('sheetHead');
  const grab = document.getElementById('grabWrap');
  return grab.offsetHeight + h.offsetHeight + safeBot() + 10;
}
function detentPx(name){
  if (name === 'full') return sheetFullPx;
  if (name === 'peek') return Math.min(headerNaturalPx(), sheetFullPx);
  return window.innerHeight * 0.5;
}
function applyDetentPx(px, animate){
  sheetEl.style.transition = animate ? '' : 'none';
  sheetEl.style.transform = 'translateY(' + Math.max(0, sheetFullPx - px) + 'px)';
  if (!animate) requestAnimationFrame(() => { sheetEl.style.transition = ''; });
}
function snapTo(name){
  detent = name;
  updateChromeForDetent(name);
  if (document.body.classList.contains('desk')) return;
  applyDetentPx(detentPx(name), true);
}
function cycleDetent(){
  const seq = ['half','full','peek'];
  snapTo(seq[(seq.indexOf(detent) + 1) % seq.length]);
}
function nearestDetent(px, vel){
  const d = { peek:detentPx('peek'), half:detentPx('half'), full:detentPx('full') };
  if (Math.abs(vel) > 0.5) return vel < 0 ? 'full' : (px > (d.half + d.full) / 2 ? 'full' : (px > (d.peek + d.half) / 2 ? 'half' : 'peek'));
  let best = 'half', bd = Infinity;
  Object.keys(d).forEach(k => { const dist = Math.abs(d[k] - px); if (dist < bd) { bd = dist; best = k; } });
  return best;
}

const DRAG_THRESHOLD = 8;
function bindDrag(el, opts){
  // Two-phase: a pointerdown only ARMS tracking. Nothing moves and nothing calls
  // preventDefault until the finger has actually travelled past DRAG_THRESHOLD in the
  // right direction — otherwise a plain tap on a row/button underneath would have its
  // native click swallowed (touch semantics cancel the synthesized click once any
  // touchmove in that gesture called preventDefault, even a 1px one).
  let armed=false, committed=false, startX=0, startY=0, startPx=0, lastY=0, lastT=0, vel=0;
  el.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('desk')) return;
    if (opts.onlyAtTop) {
      const bodyEl = activeContainers().body;
      if (bodyEl.scrollTop > 0) return;
    }
    armed = true; committed = false; startX = e.clientX; startY = lastY = e.clientY; lastT = e.timeStamp; vel = 0;
    startPx = sheetFullPx - (parseFloat((/translateY\(([-\d.]+)px\)/.exec(sheetEl.style.transform) || [0,0])[1]) || 0);
  });
  el.addEventListener('pointermove', e => {
    if (!armed) return;
    const totalDy = e.clientY - startY, totalDx = e.clientX - startX;
    if (!committed) {
      const pastThreshold = Math.abs(totalDy) > DRAG_THRESHOLD || Math.abs(totalDx) > DRAG_THRESHOLD;
      if (!pastThreshold) return;
      if (opts.onlyAtTop && !(totalDy > 0 && Math.abs(totalDy) >= Math.abs(totalDx))) { armed = false; return; }
      if (!opts.onlyAtTop && Math.abs(totalDx) > Math.abs(totalDy)) { armed = false; return; }
      committed = true;
      sheetEl.style.transition = 'none';
      try { el.setPointerCapture(e.pointerId); } catch(err){}
    }
    const dt = Math.max(1, e.timeStamp - lastT);
    vel = (e.clientY - lastY) / dt;
    const px = Math.min(sheetFullPx, Math.max(0, startPx - totalDy));
    applyDetentPx(px, false);
    lastY = e.clientY; lastT = e.timeStamp;
    e.preventDefault();
  }, { passive:false });
  function finish(){
    if (!armed) return; armed = false;
    if (!committed) return;
    committed = false;
    const cur = sheetFullPx - (parseFloat((/translateY\(([-\d.]+)px\)/.exec(sheetEl.style.transform) || [0,0])[1]) || 0);
    const target = nearestDetent(cur, vel);
    snapTo(target);
  }
  el.addEventListener('pointerup', finish);
  el.addEventListener('pointercancel', finish);
}
(function initSheetGestures(){
  bindDrag(document.getElementById('grabWrap'), {});
  bindDrag(document.getElementById('sheetHead'), {});
  bindDrag(document.getElementById('sheetBody'), { onlyAtTop:true });
  let tapStartX=0, tapStartY=0, tapStartT=0;
  document.getElementById('grabWrap').addEventListener('pointerdown', e => { tapStartX=e.clientX; tapStartY=e.clientY; tapStartT=e.timeStamp; });
  document.getElementById('grabWrap').addEventListener('pointerup', e => {
    if (document.body.classList.contains('desk')) return;
    const dx = Math.abs(e.clientX-tapStartX), dy = Math.abs(e.clientY-tapStartY), dt = e.timeStamp-tapStartT;
    if (dx < 6 && dy < 6 && dt < 400) cycleDetent();
  });
})();

/* horizontal swipe on the card body: next / previous */
(function initSwipe(){
  ['sheetBody','panelBody'].forEach(id => {
    const el = document.getElementById(id);
    let sx=0, sy=0, active=false, horiz=false;
    el.addEventListener('pointerdown', e => { if (view !== 'card') return; sx=e.clientX; sy=e.clientY; active=true; horiz=false; });
    el.addEventListener('pointermove', e => {
      if (!active) return;
      const dx = e.clientX-sx, dy = e.clientY-sy;
      if (!horiz && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) horiz = true;
      if (horiz) e.preventDefault();
    }, { passive:false });
    function fin(e){
      if (!active) return; active = false;
      if (!horiz) return;
      const dx = e.clientX - sx;
      if (dx <= -60) stepCard(1); else if (dx >= 60) stepCard(-1);
    }
    el.addEventListener('pointerup', fin);
    el.addEventListener('pointercancel', fin);
  });
})();

/* focusing search snaps to full */
document.addEventListener('focusin', e => { if (e.target && e.target.id === 'searchInput' && !document.body.classList.contains('desk')) snapTo('full'); });

/* tapping the map background snaps to peek (content kept) */
function onMapBackgroundClick(){
  if (!document.body.classList.contains('desk')) snapTo('peek');
}

/* ============================================================ chrome: pills, popover, delegated clicks */
function wireChrome(){
  document.getElementById('titlePill').addEventListener('click', () => { closeCard(); snapTo('half'); });

  document.getElementById('layersBtn').innerHTML = SVG.layers;
  document.getElementById('layersBtn').addEventListener('click', togglePopover);

  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'searchInput') {
      const pos = e.target.selectionStart;
      query = e.target.value;
      const { body } = activeContainers();
      const scrollTop = body.scrollTop;
      renderInPlace();
      const el = document.getElementById('searchInput');
      if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch(e2){} }
      body.scrollTop = scrollTop;
    }
  });

  document.addEventListener('click', handleDelegatedClick);
  document.addEventListener('keydown', handleKeydown);
  window.addEventListener('resize', onResize);
}
function renderInPlace(){
  const { head, body } = activeContainers();
  if (view === 'card' && current) { head.innerHTML = cardHeaderHTML(current); } else { head.innerHTML = renderListHeader(); body.innerHTML = renderListBody(); }
  refreshSiteVisibility();
  updateTitlePillCaption();
  recomputeDetents();
}
function setFilter(f){ activeFilter = f || null; paint(); refreshSiteVisibility(); fitToSites(visibleSites()); }

function handleDelegatedClick(e){
  const row = e.target.closest('[data-site]');
  if (row) { const s = SORTED.find(x => x.id === row.getAttribute('data-site')); if (s) openCard(s); return; }

  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) { setFilter(filterBtn.getAttribute('data-filter')); return; }

  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.getAttribute('data-act');
    if (a === 'back') { history.back(); }
    else if (a === 'prev') stepCard(-1);
    else if (a === 'next') stepCard(1);
    else if (a === 'pulseTerr') { if (current && current.regions) pulseTerritory(current.regions.map(r => r.id)); }
    else if (a === 'print') { e.preventDefault(); window.print(); }
    else if (a === 'showAll') { query=''; setFilter(null); }
    else if (a === 'clearSearch') { query=''; renderInPlace(); refreshSiteVisibility(); }
    else if (a === 'showChanged') { setFilter('changed'); }
    else if (a === 'dismissStrip') { stripDismissed = true; renderInPlace(); }
    return;
  }

  const more = e.target.closest('[data-more]');
  if (more) { const el = document.getElementById(more.getAttribute('data-more')); if (el) { el.classList.toggle('clamp'); more.textContent = el.classList.contains('clamp') ? 'more' : 'less'; } return; }

  const fly = e.target.closest('[data-fly-pipeline]');
  if (fly) {
    const id = fly.getAttribute('data-fly-pipeline');
    const rec = pipelineMarkers[id];
    const p = rec && rec.item, m = rec && rec.marker;
    if (p && m) { map.closePopup(); if (!ON.has('pipeline')) { ON.add('pipeline'); applySimpleToggles(); } map.flyTo([p.lat,p.lon], Math.max(map.getZoom(),14), { duration:0.7 }); setTimeout(() => m.openPopup(), 720); }
    return;
  }

  const tog = e.target.closest('[data-toggle]');
  if (tog) { /* handled by change event on the checkbox itself */ return; }

  if (popoverOpen && !e.target.closest('#popover') && !e.target.closest('#layersBtn')) closePopover();
}
document.addEventListener('change', e => {
  if (e.target && e.target.matches('[data-toggle]')) {
    const key = e.target.getAttribute('data-toggle');
    const cats = key === 'daytime' ? DAY_KEYS : [key];
    cats.forEach(c => { if (e.target.checked) ON.add(c); else ON.delete(c); });
    applySimpleToggles();
    scheduleContextUpdate();
  }
});

function handleKeydown(e){
  if (!document.body.classList.contains('desk')) return;
  const ae = document.activeElement;
  const typing = !!ae && (ae.id === 'searchInput' || ['INPUT','TEXTAREA','SELECT'].indexOf(ae.tagName) !== -1);
  if (e.key === 'Escape') {
    if (popoverOpen) { closePopover(); return; }
    if (view === 'card') { history.back(); }
    else if (typing) { document.activeElement.blur(); }
    return;
  }
  if (typing) return;
  const list = visibleSites();
  if (view === 'list') {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      highlightIndex = Math.max(0, Math.min(list.length - 1, highlightIndex + (e.key === 'ArrowDown' ? 1 : -1)));
      const { body } = activeContainers();
      body.querySelectorAll('.siteRow').forEach((r,i) => r.classList.toggle('kbd', i === highlightIndex));
      const el = body.querySelectorAll('.siteRow')[highlightIndex];
      if (el) el.scrollIntoView({ block:'nearest' });
    } else if (e.key === 'Enter') {
      if (highlightIndex >= 0 && list[highlightIndex]) openCard(list[highlightIndex]);
    }
  } else if (view === 'card') {
    if (e.key === 'ArrowLeft') stepCard(-1);
    else if (e.key === 'ArrowRight') stepCard(1);
  }
}

function onResize(){
  const desk = isDesk();
  const was = document.body.classList.contains('desk');
  if (desk !== was) {
    document.body.classList.toggle('desk', desk);
    closePopover();
    paint();
    setTimeout(() => map.invalidateSize(), 60);
  } else {
    recomputeDetents();
  }
}

/* ============================================================ Show-on-the-map popover */
function popoverRowHTML(key, label, leftHTML, count){
  const checked = key === 'daytime' ? DAY_KEYS.every(k => ON.has(k)) : ON.has(key);
  return '<div class="togRow"><span class="togLeft">' + leftHTML + '</span><span class="togLabel">' + esc(label) + '</span>' +
    (count != null ? '<span class="togCount">' + count + '</span>' : '') +
    '<label class="switch"><input type="checkbox" data-toggle="' + key + '"' + (checked ? ' checked' : '') + '><span class="track"><span class="thumb"></span></span></label></div>';
}
function brandsIn(cat){ const set = new Set(); (contextRaw[cat] || []).forEach(i => { if (i.brand) set.add(i.brand); }); return [...set]; }
function buildPopoverHTML(){
  const c = META.counts || {};
  const clientLogo = LOGOS[META.client];
  let h = '<div class="popHead"><h3>Show on the map</h3><button class="popClose" data-act="closePop">' + SVG.close + '</button></div>';
  h += popoverRowHTML('stores', 'Existing stores', clientLogo ? '<span class="togLogos"><img src="' + clientLogo + '" alt=""></span>' : '<span class="togDot" style="background:var(--navy)"></span>', c.stores);
  h += popoverRowHTML('territories', 'Territories', '<span class="togDot" style="background:#3f60a0"></span>', (DATA.territories || []).length);
  h += popoverRowHTML('pipeline', 'Coming soon', '<span class="togDot" style="background:var(--pipe)"></span>', c.pipeline);
  h += popoverRowHTML('grocery', CATL.grocery, logosStrip(brandsIn('grocery'),3) || '<span class="togDot" style="background:' + CATC.grocery + '"></span>', c.grocery);
  h += popoverRowHTML('bigbox', CATL.bigbox, logosStrip(brandsIn('bigbox'),3) || '<span class="togDot" style="background:' + CATC.bigbox + '"></span>', c.bigbox);
  h += popoverRowHTML('competitor', CATL.competitor, logosStrip(brandsIn('competitor'),3) || '<span class="togDot" style="background:' + CATC.competitor + '"></span>', c.competitor);
  h += popoverRowHTML('traffic', CATL.traffic, logosStrip(brandsIn('traffic'),3) || '<span class="togDot" style="background:' + CATC.traffic + '"></span>', c.traffic);
  const dayCount = DAY_KEYS.reduce((a,k) => a + (c[k]||0), 0);
  const letters = '<span class="dayLetters">' + DAY_KEYS.map(k => '<span style="background:' + DAY[k][1] + '">' + DAY[k][0] + '</span>').join('') + '</span>';
  h += popoverRowHTML('daytime', 'Daytime drivers', letters, dayCount);
  h += '<div class="popCaption">Grocery, big box, competitors and daytime drivers appear once you zoom in to a site.</div>';
  return h;
}
function togglePopover(){ popoverOpen ? closePopover() : openPopover(); }
function openPopover(){
  const pop = document.getElementById('popover');
  pop.innerHTML = buildPopoverHTML();
  const btn = document.getElementById('layersBtn');
  const r = btn.getBoundingClientRect();
  pop.style.top = (r.bottom + 8) + 'px';
  pop.style.right = (window.innerWidth - r.right) + 'px';
  pop.classList.add('open');
  popoverOpen = true;
}
function closePopover(){ document.getElementById('popover').classList.remove('open'); popoverOpen = false; }
document.addEventListener('click', e => { if (e.target.closest('[data-act="closePop"]')) closePopover(); });

/* ============================================================ print view */
function buildPrintView(){
  let pv = '<h1>' + esc(META.title || '') + '</h1><div>Sites as of ' + esc(fmtShort(META.sites_as_of)) + '. ' + esc(META.territory_note || '') + '</div>';
  pv += '<table><tr><th>#</th><th>Site</th><th>Status</th><th>Territory</th><th>Size</th><th>Asking</th><th>NNN</th><th>Traffic</th><th>Notes</th></tr>';
  SORTED.forEach(s => {
    pv += '<tr><td>' + s._n + '</td><td>' + esc(s.name) + '<br>' + esc(s.address) + ', ' + esc(s.city) + '</td><td>' + esc(s.status_label || SHORT[s.status]) + '</td>' +
      '<td>' + esc(s.region || '') + (s.region_who ? '<br>' + esc(s.region_who) : '') + '</td><td>' + esc(sizeText(s)) + '</td><td>' + esc(rentText(s)) + '</td><td>' + esc(nnnText(s)) + '</td>' +
      '<td>' + esc(s.traffic || '') + '</td><td>' + esc(s.notes || '') + (s.brochure_url ? '<br>' + esc(s.brochure_url) : '') + '</td></tr>';
  });
  pv += '</table><div style="margin-top:8px">' + esc(META.contact_line || '') + '</div>';
  document.getElementById('printview').innerHTML = pv;
}

})();
