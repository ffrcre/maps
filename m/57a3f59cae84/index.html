<style>

  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); background:var(--bg); font-size:14px; }

  #top { position:fixed; top:calc(var(--banner) + env(safe-area-inset-top)); left:0; right:0; height:var(--topbar); z-index:1200; background:var(--navy); color:#fff; display:flex; align-items:center; gap:8px; padding:0 10px 0 14px; }

  #client option { color:#000; }
  .seg { display:inline-flex; background:rgba(255,255,255,.14); border-radius:9px; padding:2px; }
  .seg button { background:transparent; color:#fff; border:0; border-radius:7px; padding:6px 10px; font-size:13px; }
  .seg button.on { background:#fff; color:var(--navy); font-weight:600; }
  .iconbtn { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:9px; padding:7px 11px; font-size:13px; }
  body.desk .mobile-only { display:none !important; }
  #chips { position:fixed; top:calc(var(--banner) + var(--topbar) + env(safe-area-inset-top)); left:0; right:0; z-index:1150; display:flex; gap:6px; padding:8px 10px; overflow-x:auto; scrollbar-width:none; background:linear-gradient(rgba(244,245,247,.97), rgba(244,245,247,.86)); backdrop-filter:blur(6px); }
  #chips::-webkit-scrollbar { display:none; }
  body.desk #chips { left:var(--panelw); }
  .chip { flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:6px 11px; font-size:12.5px; font-weight:600; color:var(--muted); }
  .chip .dot { width:9px; height:9px; border-radius:50%; background:#c5cad3; }
  .chip.on { color:var(--ink); border-color:#c9cfda; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .chip.on .dot { background:var(--c); }
  .chip .n { font-weight:500; color:var(--muted); }
  .chip.all { background:var(--navy); color:#fff; border-color:var(--navy); }
  .chip.all.dim { background:#fff; color:var(--muted); border-color:var(--line); }
  .chip.held.on .dot { background:#fff; border:2px solid #2f6fd8; box-sizing:border-box; }
  #map { position:fixed; inset:0; }
  body.desk #map { left:var(--panelw); }
  #panel { position:fixed; top:calc(var(--banner) + var(--topbar) + env(safe-area-inset-top)); bottom:0; left:0; width:var(--panelw); background:var(--panel); border-right:1px solid var(--line); z-index:1100; display:none; flex-direction:column; }
  body.desk #panel { display:flex; }
  #sheet { position:fixed; left:0; right:0; bottom:0; height:66vh; background:var(--panel); border-radius:16px 16px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2); z-index:1150; display:none; flex-direction:column; padding-bottom:env(safe-area-inset-bottom); }
  #sheet.open { display:flex; }
  body.desk #sheet { display:none !important; }
  .grab { width:38px; height:4px; background:#cfd4dd; border-radius:2px; margin:8px auto 2px; flex:0 0 auto; }
  .tabs { display:flex; gap:2px; padding:8px 8px 0; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .tabs button { background:transparent; border:0; border-bottom:2px solid transparent; padding:8px 9px; font-size:13px; font-weight:600; color:var(--muted); }

  .tabbody { flex:1; overflow:auto; padding:10px 14px 18px; }

  .site.dim { opacity:.62; }
  .site .num { flex:0 0 26px; height:26px; border-radius:50%; color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .site .num.held { background:#fff !important; color:#2f6fd8; border:2px dashed #2f6fd8; }
  .site b { display:block; font-size:14px; font-weight:600; }
  .site .sub { font-size:12px; color:var(--muted); margin-top:2px; line-height:1.35; }
  .tag { display:inline-block; font-size:11px; font-weight:700; color:#fff; border-radius:8px; padding:2px 8px; }
  .tag.grey { background:#eef1f5; color:var(--ink); font-weight:600; }
  .site .tag { margin-left:6px; vertical-align:1px; padding:1px 7px; }
  .row { display:flex; align-items:center; gap:10px; padding:7px 0; font-size:14px; }

  .logos img { width:20px; height:20px; object-fit:contain; border-radius:4px; background:#fff; border:1px solid var(--line); }
  h3.sec { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:14px 0 4px; }
  .sw { width:14px; height:14px; border-radius:50%; display:inline-block; flex:0 0 auto; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  'use strict';
  const SLUG = 'int-' + (location.pathname.replace(/[^a-z0-9]/gi,'').slice(-24) || 'clientmap');
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let LOGOS = {}; try { LOGOS = JSON.parse(document.getElementById('logos').textContent || '{}'); } catch (e) {}
  async function unlock(pw){
    const v = JSON.parse(document.getElementById('sealed').textContent);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(v.salt), iterations:v.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(v.nonce)}, key, b64(v.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const lock = document.getElementById('lock'), pwEl = document.getElementById('pw'), err = document.getElementById('err');
  async function tryOpen(pw, remember){
    err.textContent = 'Opening…';
    try { const data = await unlock(pw); if (remember) localStorage.setItem('cm-pw-'+SLUG, pw); else localStorage.removeItem('cm-pw-'+SLUG); lock.style.display = 'none'; boot(data); }
    catch (e) { err.textContent = 'That passphrase didn’t work.'; localStorage.removeItem('cm-pw-'+SLUG); }
  }
  document.getElementById('lockform').addEventListener('submit', e => { e.preventDefault(); tryOpen(pwEl.value.trim(), document.getElementById('remember').checked); });
  const saved = localStorage.getItem('cm-pw-'+SLUG); if (saved) tryOpen(saved, true);

  const STATUS = { new:'#2f6fd8', go:'#1f9d4a', hold:'#e0a100', pass:'#8a8f98', loi:'#7b3fd6', lease:'#e0631a', executed:'#0b6b3a' };
  const ORDER = ['executed','lease','loi','go','hold','new','pass'];
  const SHORT = { new:'New', go:'Go', hold:'On hold', pass:'Passed', loi:'LOI', lease:'Lease', executed:'Executed' };
  const CATC = { grocery:'#16a34a', bigbox:'#2563eb', traffic:'#9333ea', competitor:'#dc2626' };
  const CATL = { grocery:'Grocery', bigbox:'Big box and club', traffic:'Traffic drivers', competitor:'Competitors' };
  const DAY = { hospital:['H','#0e7490','Hospitals and medical campuses'], university:['U','#0f766e','Universities and colleges'], high_school:['S','#0369a1','High schools'], military:['M','#4b5563','Military installations'], office_park:['O','#7c2d12','Office parks (≥0.1 sq mi, OSM)'] };
  const DEFAULT_ON = new Set(['sites','held','territories','stores','pipeline','grocery','competitor','hospital']);
  const fmt = iso => { if (!iso) return 'n/a'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); };
  function logoIcon(brand, colour, size){
    const src = LOGOS[brand];
    const html = src ? '<div class="badge" style="border-color:' + colour + '"><img src="' + src + '" alt=""></div>' : '<div class="badge txt" style="background:' + colour + ';border-color:#fff">' + esc((brand || '?').slice(0,2)) + '</div>';
    return L.divIcon({ className:'', html, iconSize:[size,size], iconAnchor:[size/2,size/2], popupAnchor:[0,-size/2] });
  }

  let map, current;
  function boot(all){
    document.body.classList.toggle('desk', window.innerWidth >= 900);
    const sel = document.getElementById('client');
    const clients = all.clients || [];
    sel.innerHTML = clients.map((c, i) => '<option value="' + i + '">' + esc(c.display_name) + (c.engagement ? ' · ' + esc(c.engagement) : '') + '</option>').join('');
    if (clients.length < 2) sel.style.display = 'none';
    map = L.map('map', { zoomControl:false, preferCanvas:true }).setView([39.55,-104.9], 9);
    L.control.zoom({ position:'bottomright' }).addTo(map);
    const aerial = L.layerGroup([
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Imagery: Esri, Maxar, Earthstar Geographics' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, opacity:.9 }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom:19 })]);
    const street = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom:19, attribution:'Map: Esri, HERE, Garmin, OpenStreetMap contributors' });
    aerial.addTo(map);
    const bA = document.getElementById('b-aerial'), bS = document.getElementById('b-street');
    bA.onclick = () => { map.removeLayer(street); aerial.addTo(map); bA.classList.add('on'); bS.classList.remove('on'); };
    bS.onclick = () => { map.removeLayer(aerial); street.addTo(map); bS.classList.add('on'); bA.classList.remove('on'); };
    sel.onchange = () => showClient(clients[+sel.value]);
    window.addEventListener('resize', () => { const d = window.innerWidth >= 900; if (d !== document.body.classList.contains('desk')) { document.body.classList.toggle('desk', d); if (current) current.renderPanels(); setTimeout(() => map.invalidateSize(), 60); } });
    if (clients.length) showClient(clients[0]); else document.getElementById('title').textContent = 'No client built yet';
  }

  function showClient(data){
    if (current) current.teardown();
    const meta = data.meta || {};
    document.getElementById('title').textContent = esc(data.display_name) + ' — internal';
    document.getElementById('stamp').textContent = 'Sites as of ' + fmt(meta.sites_as_of) + ' · built ' + fmt(meta.generated_at);
    const groups = {}, everything = [];
    const track = g => { everything.push(g); return g; };

    const terr = track(L.layerGroup());
    (data.territories || []).forEach(t => {
      const p = t.properties || {}; const col = p.colour || '#3f60a0';
      const gj = L.geoJSON({type:'Feature', geometry:t.geometry}, { style:{ color:col, weight:2, opacity:.9, fillColor:col, fillOpacity:.12 } });
      gj.bindTooltip(esc(p.short) + ' · ' + esc(p.developer), { permanent:true, direction:'center', className:'terr-label' });
      gj.bindPopup('<div class="pop"><h4>' + esc(p.name) + '</h4><div class="addr">' + esc(p.developer) + '</div><div class="grid"><div><b>Computed</b><span>' + esc(p.area_sqmi_computed) + ' sq mi</span></div><div><b>Printed on the map</b><span>' + esc(p.area_sqmi_stated) + ' sq mi</span></div></div><div class="src">' + esc(p.method) + ': ' + esc(p.source) + '</div></div>');
      terr.addLayer(gj);
    });
    groups.territories = terr;

    const sorted = (data.sites || []).slice().sort((a,b) => (b.client_shown - a.client_shown) || ORDER.indexOf(a.status) - ORDER.indexOf(b.status) || a.name.localeCompare(b.name));
    sorted.forEach((s, i) => s._n = i + 1);
    const siteMarkers = {};
    const sites = track(L.layerGroup()), held = track(L.layerGroup());
    sorted.forEach(s => {
      const col = STATUS[s.status] || STATUS.new;
      const icon = L.divIcon({ className:'', html:'<div class="pin' + (s.client_shown ? '' : ' held') + '" style="background:' + col + '"><span>' + s._n + '</span></div>', iconSize:[28,28], iconAnchor:[14,28], popupAnchor:[0,-26] });
      siteMarkers[s.id] = L.marker([s.lat, s.lon], { icon, title:s.name }).bindPopup(sitePopup(s), { maxWidth:380 });
    });
    groups.sites = sites; groups.held = held;
    const statusOn = new Set(Object.keys(STATUS));
    function applySites(){ sites.clearLayers(); held.clearLayers(); sorted.forEach(s => { if (statusOn.has(s.status)) (s.client_shown ? sites : held).addLayer(siteMarkers[s.id]); }); }
    applySites();

    const stores = track(L.layerGroup());
    const clientLogo = LOGOS[data.display_name];
    ((data.stores || {}).stores || []).forEach(st => {
      if (st.lat == null) return;
      const html = clientLogo ? '<div class="store"><img src="' + clientLogo + '" alt=""></div>' : '<div class="store txt">' + esc(st.store_no || '★') + '</div>';
      stores.addLayer(L.marker([st.lat, st.lon], { icon:L.divIcon({ className:'', html, iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-16] }) }).bindPopup('<div class="pop"><h4>' + esc(data.display_name) + ' #' + esc(st.store_no) + '</h4><div class="addr">' + esc(st.address) + ', ' + esc(st.city) + '</div><div class="src">Coordinate: ' + esc(st.coord_source) + '</div></div>'));
    });
    groups.stores = stores;

    const pipe = track(L.layerGroup());
    (data.pipeline || []).forEach(p => {
      if (p.lat == null) return;
      const cls = p.kind === 'competitor-opening' ? 'dev comp' : (p.audience === 'internal' ? 'dev int' : 'dev');
      pipe.addLayer(L.marker([p.lat, p.lon], { icon:L.divIcon({ className:'', html:'<div class="' + cls + '"></div>', iconSize:[20,20], iconAnchor:[10,10], popupAnchor:[0,-10] }), title:p.title })
        .bindPopup('<div class="pop"><h4>' + esc(p.title) + '</h4><div class="chipline"><span class="tag" style="background:#c04b8f">' + esc(p.kind) + '</span><span class="tag grey">' + esc(p.status || '') + '</span><span class="tag" style="background:' + (p.audience === 'both' ? '#1f9d4a' : '#6b7280') + '">' + (p.audience === 'both' ? 'on the client page' : 'internal only') + '</span></div><div class="addr">' + esc(p.region || '') + (p.region_who ? ' · ' + esc(p.region_who) : '') + '</div>' + (p.summary_client ? '<div class="notes"><b>Client reads:</b> ' + esc(p.summary_client) + '</div>' : '') + '<div class="conf"><b>Internal:</b> ' + esc(p.summary_internal || '') + '</div><div class="src">' + esc(p.source_public || '') + ' (' + esc(p.reported || '') + ') · ' + esc(p.coord_source || '') + '</div></div>'));
    });
    groups.pipeline = pipe;

    const layers = {}; ((data.osm || {}).items || []).forEach(it => { (layers[it.cat] = layers[it.cat] || []).push(it); });
    const dotGroups = {}, badgeGroups = {};
    Object.keys(layers).forEach(cat => {
      const dots = track(L.layerGroup()), badges = track(L.layerGroup());
      layers[cat].forEach(it => {
        const col = DAY[cat] ? DAY[cat][1] : (CATC[cat] || '#333');
        const pop = '<div class="pop"><h4>' + esc(it.name || it.brand) + '</h4><div class="chipline"><span class="tag" style="background:' + col + '">' + esc(DAY[cat] ? DAY[cat][2] : (it.sub || it.brand || cat)) + '</span>' + (it.status && it.status !== 'open' ? '<span class="tag grey">' + esc(it.status) + '</span>' : '') + '</div><div class="addr">' + esc(it.addr || '') + '</div><div class="src">' + esc(it.id) + (it.source ? ' · ' + esc(it.source) : '') + (it.area_sqmi ? ' · ' + it.area_sqmi + ' sq mi' : '') + '</div></div>';
        dots.addLayer(L.circleMarker([it.lat, it.lon], { radius:4, color:'#fff', weight:1, fillColor:col, fillOpacity:.95 }).bindPopup(pop));
        const icon = DAY[cat] ? L.divIcon({ className:'', html:'<div class="day" style="background:' + col + '">' + DAY[cat][0] + '</div>', iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12] }) : logoIcon(it.brand, col, 28);
        badges.addLayer(L.marker([it.lat, it.lon], { icon, title:it.name || it.brand }).bindPopup(pop));
      });
      dotGroups[cat] = dots; badgeGroups[cat] = badges; groups[cat] = badges;
    });

    const on = new Set(DEFAULT_ON);
    function apply(){
      const z = map.getZoom();
      Object.keys(groups).forEach(k => {
        if (dotGroups[k]) {
          const wantDots = on.has(k) && z >= 10 && z < 12, wantBadges = on.has(k) && z >= 12;
          if (wantDots && !map.hasLayer(dotGroups[k])) dotGroups[k].addTo(map); if (!wantDots && map.hasLayer(dotGroups[k])) map.removeLayer(dotGroups[k]);
          if (wantBadges && !map.hasLayer(badgeGroups[k])) badgeGroups[k].addTo(map); if (!wantBadges && map.hasLayer(badgeGroups[k])) map.removeLayer(badgeGroups[k]);
        } else { if (on.has(k) && !map.hasLayer(groups[k])) groups[k].addTo(map); if (!on.has(k) && map.hasLayer(groups[k])) map.removeLayer(groups[k]); }
      });
      ['sites','held'].forEach(k => { if (map.hasLayer(groups[k])) { map.removeLayer(groups[k]); groups[k].addTo(map); } });
    }
    const onZoom = () => apply(); map.on('zoomend', onZoom); apply();
    const pts = sorted.map(s => [s.lat, s.lon]); if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.12));

    const chips = document.getElementById('chips');
    function renderChips(){
      const counts = {}; sorted.forEach(s => counts[s.status] = (counts[s.status] || 0) + 1);
      const heldN = sorted.filter(s => !s.client_shown).length;
      const allOn = Object.keys(STATUS).every(k => statusOn.has(k));
      let h = '<button class="chip all' + (allOn ? '' : ' dim') + '" data-all="1">All sites</button>';
      ORDER.forEach(k => { if (!counts[k]) return; h += '<button class="chip' + (statusOn.has(k) ? ' on' : '') + '" data-status="' + k + '" style="--c:' + STATUS[k] + '"><span class="dot"></span>' + esc(SHORT[k]) + ' <span class="n">' + counts[k] + '</span></button>'; });
      h += '<button class="chip held' + (on.has('held') ? ' on' : '') + '" data-held="1" style="--c:#fff"><span class="dot"></span>Held back <span class="n">' + heldN + '</span></button>';
      chips.innerHTML = h;
      chips.querySelectorAll('[data-status]').forEach(b => b.onclick = () => { const k = b.getAttribute('data-status'); if (statusOn.has(k)) statusOn.delete(k); else statusOn.add(k); applySites(); renderChips(); renderPanels(); });
      chips.querySelector('[data-all]').onclick = () => { const all = Object.keys(STATUS).every(k => statusOn.has(k)); statusOn.clear(); if (!all) Object.keys(STATUS).forEach(k => statusOn.add(k)); applySites(); renderChips(); renderPanels(); };
      chips.querySelector('[data-held]').onclick = () => { if (on.has('held')) on.delete('held'); else on.add('held'); apply(); renderChips(); };
    }
    renderChips();

    let tab = 'sites', query = '';
    const tabsHtml = () => ['sites','layers','issues'].map(t => '<button data-tab="' + t + '"' + (tab === t ? ' class="on"' : '') + '>' + ({sites:'Sites', layers:'Layers', issues:'Issues'})[t] + '</button>').join('');
    function sitesHtml(){
      const q = query.toLowerCase();
      const list = sorted.filter(s => statusOn.has(s.status) && (on.has('held') || s.client_shown) && (!q || [s.name, s.address, s.city, s.region, s.client_notes, s.owner_of_record, (s.broker||{}).name].join(' ').toLowerCase().includes(q)));
      let h = '<input class="search" id="q" type="search" placeholder="Search sites, owners, brokers, regions" value="' + esc(query) + '">';
      list.forEach(s => { h += '<div class="site' + (s.client_shown ? '' : ' dim') + '" data-site="' + esc(s.id) + '"><div class="num' + (s.client_shown ? '' : ' held') + '" style="background:' + (STATUS[s.status]||'#888') + '">' + s._n + '</div><div><b>' + esc(s.name) + '<span class="tag" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(SHORT[s.status] || s.status) + '</span>' + (s.client_shown ? '' : '<span class="tag grey">held back</span>') + '</b><div class="sub">' + esc(s.address) + ', ' + esc(s.city) + ' · row ' + esc(s.row) + '<br>' + esc(s.region) + (s.region_who ? ' · ' + esc(s.region_who) : '') + '</div></div></div>'; });
      return h;
    }
    const logosStrip = brands => { const im = brands.filter(b => LOGOS[b]).slice(0,6).map(b => '<img src="' + LOGOS[b] + '" alt="" title="' + esc(b) + '">').join(''); return im ? '<span class="logos">' + im + '</span>' : ''; };
    const row = (k, label, sw, n) => '<label class="row"><input type="checkbox" data-layer="' + k + '"' + (on.has(k) ? ' checked' : '') + '>' + sw + '<span>' + label + '</span>' + (n != null ? '<span class="n">' + n + '</span>' : '') + '</label>';
    function layersHtml(){
      const brandsIn = cat => { const set = new Set(); (layers[cat] || []).forEach(i => i.brand && set.add(i.brand)); return [...set]; };
      let h = '<div class="conf"><b>Confidential.</b> ' + esc(meta.banner || '') + '</div><h3 class="sec">On the map</h3>';
      h += row('sites', 'Sites shown to the client', '<span class="sw" style="background:' + STATUS.new + '"></span>', sorted.filter(s => s.client_shown).length);
      h += row('held', 'Sites held back (Client Map blank)', '<span class="sw" style="background:#fff;border:2px dashed #2f6fd8"></span>', sorted.filter(s => !s.client_shown).length);
      h += row('territories', 'Territories (approximate)', '<span class="sw" style="background:#3f60a0;opacity:.5"></span>', (data.territories || []).length);
      h += row('stores', 'Existing stores', clientLogo ? '<span class="logos"><img src="' + clientLogo + '" alt=""></span>' : '<span class="sw sq" style="background:#1b2a4a"></span>', ((data.stores || {}).stores || []).length);
      h += row('pipeline', 'Development pipeline (grey = internal only)', '<span class="sw dia" style="background:#c04b8f"></span>', (data.pipeline || []).filter(p => p.lat != null).length);
      h += '<h3 class="sec">Anchors and competitors</h3>';
      ['grocery','bigbox','traffic','competitor'].forEach(k => { if (layers[k]) h += row(k, CATL[k], logosStrip(brandsIn(k)) || '<span class="sw" style="background:' + CATC[k] + '"></span>', layers[k].length); });
      h += '<h3 class="sec">Daytime drivers</h3>';
      Object.keys(DAY).forEach(k => { if (layers[k]) h += row(k, DAY[k][2], '<span class="sw" style="background:' + DAY[k][1] + '"></span>', layers[k].length); });
      h += '<div class="note" style="margin-top:10px">Dots from zoom 10, logos from zoom 12. ' + esc(meta.internal_contact_line || '') + '</div>';
      return h;
    }
    function issuesHtml(){
      let h = '<h3 class="sec">Open questions</h3>'; (data.questions || []).forEach(q => { h += '<div class="item"><b>' + esc(q.q) + '</b><span>' + esc(q.why || '') + '</span></div>'; });
      h += '<h3 class="sec">Dropped rows (' + (data.dropped || []).length + ')</h3><div class="note">Never placed approximately. Fix the sheet and the next refresh picks it up.</div>';
      (data.dropped || []).forEach(d => { h += '<div class="item"><b>Row ' + esc(d.row) + ': ' + esc(d.name) + '</b><span>' + esc(d.address || '') + (d.city ? ', ' + esc(d.city) : '') + ' — ' + esc(d.reason) + '</span></div>'; });
      h += '<h3 class="sec">Pipeline entries without a coordinate</h3>'; (data.pipeline || []).filter(p => p.lat == null).forEach(p => { h += '<div class="item"><b>' + esc(p.title) + '</b><span>' + esc(p.status || '') + ' — ' + esc(p.summary_internal || '') + '</span></div>'; });
      const o = data.osm || {};
      h += '<h3 class="sec">Anchor data</h3><div class="note">Pulled ' + fmt(o.pulled_at) + '. ' + esc(o.source || '') + '</div>';
      (o.count_sanity || []).forEach(c => { h += '<div class="item"><b>' + esc(c.brand) + ': ' + esc(c.osm) + ' on the map</b><span>' + esc(c.reality || '') + ' — ' + esc(c.verdict || '') + '</span></div>'; });
      h += '<details><summary>Sheet join, row by row</summary><table class="mini">'; (data.joins || []).forEach(j => { h += '<tr><td>' + esc(j.row) + '</td><td>' + esc(j.name) + '</td><td>' + esc(j.how) + (j.submittal_tab ? ' → ' + esc(j.submittal_tab) + ' row ' + esc(j.submittal_row) : '') + '</td></tr>'; }); h += '</table></details>';
      return h;
    }
    function wire(root){
      root.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.getAttribute('data-tab'); renderPanels(); });
      const q = root.querySelector('#q'); if (q) q.oninput = () => { query = q.value; const pos = q.selectionStart; renderPanels(); const nq = root.querySelector('#q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); } };
      root.querySelectorAll('[data-site]').forEach(el => el.onclick = () => { const m = siteMarkers[el.getAttribute('data-site')]; if (!m) return; on.add('sites'); on.add('held'); apply(); map.setView(m.getLatLng(), Math.max(map.getZoom(), 15)); m.openPopup(); sheet.classList.remove('open'); });
      root.querySelectorAll('[data-layer]').forEach(cb => cb.onchange = () => { const k = cb.getAttribute('data-layer'); if (cb.checked) on.add(k); else on.delete(k); apply(); renderChips(); });
    }
    const panel = document.getElementById('panel'), sheet = document.getElementById('sheet');
    function renderPanels(){
      const body = tab === 'sites' ? sitesHtml() : tab === 'layers' ? layersHtml() : issuesHtml();
      if (document.body.classList.contains('desk')) { document.getElementById('ptabs').innerHTML = tabsHtml(); document.getElementById('pbody').innerHTML = body; wire(panel); }
      else { document.getElementById('stabs').innerHTML = tabsHtml(); document.getElementById('sbody').innerHTML = body; wire(sheet); }
    }
    document.getElementById('b-sites').onclick = () => { if (sheet.classList.contains('open') && tab === 'sites') sheet.classList.remove('open'); else { tab = 'sites'; renderPanels(); sheet.classList.add('open'); } };
    document.getElementById('b-layers').onclick = () => { if (sheet.classList.contains('open') && tab !== 'sites') sheet.classList.remove('open'); else { tab = 'layers'; renderPanels(); sheet.classList.add('open'); } };
    const onMapClick = () => sheet.classList.remove('open'); map.on('click', onMapClick);
    renderPanels();
    current = { renderPanels, teardown(){ everything.forEach(g => { if (map.hasLayer(g)) map.removeLayer(g); }); map.off('zoomend', onZoom); map.off('click', onMapClick); } };
  }

  function sitePopup(s){
    const p = s.pipeline || {}, sub = s.submittal || {};
    const size = s.size_sf ? Math.round(s.size_sf).toLocaleString() + ' SF' : (sub['Available Space (1,000-2,500 SF fit)'] || '');
    const ask = s.rent_psf ? '$' + s.rent_psf.toFixed(2) + '/SF' : (sub['Base Rent ($/SF)'] || '');
    const nnn = s.cam_psf ? '$' + s.cam_psf.toFixed(2) + '/SF' : (sub['Triple Net / NNN ($/SF)'] || '');
    let h = '<div class="pop"><h4>' + s._n + '. ' + esc(s.name) + '</h4>';
    h += '<div class="chipline"><span class="tag" style="background:' + (STATUS[s.status]||'#888') + '">' + esc(s.status_label) + '</span>' + (s.client_shown ? '<span class="tag" style="background:#1f9d4a">on client page</span>' : '<span class="tag grey">held back</span>') + '<span class="tag grey">' + esc(s.region) + (s.region_who ? ' · ' + esc(s.region_who) : '') + '</span></div>';
    h += '<div class="addr">' + esc(s.address) + ', ' + esc(s.city) + ' ' + esc(s.zip || '') + ' · sheet row ' + esc(s.row) + ' · stage ' + esc(s.stage) + ' · Client Map: ' + esc(s.client_map || '(blank)') + ' · RD: ' + esc(s.rd || '—') + '</div>';
    const cells = [['Size', size], ['Asking', ask], ['NNN', nnn], ['Traffic', s.traffic || '']].filter(c => c[1]);
    if (cells.length) h += '<div class="grid">' + cells.map(c => '<div><b>' + c[0] + '</b><span>' + esc(c[1]) + '</span></div>').join('') + '</div>';
    if (s.condition) h += '<div class="notes"><b>Condition:</b> ' + esc(s.condition) + '</div>';
    if (s.client_notes) h += '<div class="notes"><b>Client sees:</b> ' + esc(s.client_notes) + '</div>';
    h += '<div class="conf"><b>Owner of record:</b> ' + esc(s.owner_of_record || 'not pulled') + '</div>';
    if (s.broker && (s.broker.name || s.broker.firm)) h += '<div class="conf"><b>Broker:</b> ' + esc([s.broker.name, s.broker.firm, s.broker.phone, s.broker.email].filter(Boolean).join(' · ')) + '</div>';
    if (s.broker_notes) h += '<details><summary>Broker Notes (sheet)</summary><div class="conf">' + esc(s.broker_notes) + '</div></details>';
    if (s.pos_notes) h += '<details><summary>Franchisor notes (sheet)</summary><div class="conf">' + esc(s.pos_notes) + '</div></details>';
    if (s.notable_detail) h += '<details><summary>Notable detail (submittal sheet)</summary><div class="conf">' + esc(s.notable_detail) + '</div></details>';
    if (p['LOI Submitted'] || p['Executed Lease'] || p['Tenant Improvement $']) h += '<div class="conf"><b>Deal fields:</b> LOI ' + esc(p['LOI Submitted'] || '—') + ' · TI ' + esc(p['Tenant Improvement $'] || '—') + ' · executed lease ' + esc(p['Executed Lease'] || '—') + '</div>';
    h += '<div class="links">' + (s.brochure_url ? '<a href="' + esc(s.brochure_url) + '" target="_blank" rel="noopener noreferrer">Brochure ↗</a>' : '') + '<a class="ghost" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.lat + ',' + s.lon) + '" target="_blank" rel="noopener noreferrer">Google Maps ↗</a></div>';
    h += '<div class="src">Coordinate: ' + esc((s.geocode || {}).source) + ' · ' + esc((s.geocode || {}).matched || '') + '</div></div>';
    return h;
  }
})();
</script>
</body>
</html>
